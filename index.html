<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오스키실 예약판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== 설정: Supabase → Project Settings → API 에서 복사 =====
   비워두면 예시 데이터로 도는 미리보기 모드가 됩니다. */
window.OSCE_CONFIG = {
  SUPABASE_URL: "",
  SUPABASE_ANON_KEY: ""
};
/* 테마: 기본은 밝게, 다크는 버튼으로 따로 */
(function(){var t="light";try{t=localStorage.getItem("osce-theme")||"light"}catch(e){}document.documentElement.setAttribute("data-theme",t)})();
</script>
<style>
/* Layout: 흰 상단 바(날짜·조장 로그인·테마) → 주간 줄 → 방 1–6 × 시간 격자(조별 파스텔) + 재료 현황. 신청·상세·로그인은 오른쪽 서랍 */
:root{
  color-scheme:light;
  --bg:#f5f8fa; --surface:#ffffff; --sunk:#f0f4f7; --line:#e6ecf0; --line-strong:#d2dbe1;
  --fg:#16212a; --muted:#64737f; --faint:#a3b0ba;
  --accent:#0fa394; --accent-ink:#0b7f74; --accent-soft:#e2f6f3; --on-accent:#ffffff;
  --out:#e04f3a; --out-soft:#fdebe7; --held:#d48a0b; --held-soft:#fdf3dd; --ok:#22a05a; --ok-soft:#e3f6ea;
  --shadow:0 1px 2px rgba(22,40,55,.04),0 6px 20px rgba(22,40,55,.06);
  /* 조별 파스텔 (bg / ink) */
  --p0:#e3f1ff; --p0i:#1f5f9e; --p1:#ffe9e3; --p1i:#a1442d; --p2:#e5f7e8; --p2i:#2b7a3e; --p3:#f3e8ff; --p3i:#6b3fa0;
  --p4:#fff4d6; --p4i:#8a6200; --p5:#e0f6f6; --p5i:#1d7272; --p6:#ffe6f1; --p6i:#a3326a; --p7:#ebeefe; --p7i:#3d4fa8;
  --t-sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --t-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hour:48px; --r:12px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1316; --surface:#151c20; --sunk:#1b2328; --line:#232d33; --line-strong:#34414a;
  --fg:#e8eef2; --muted:#93a2ad; --faint:#5f6e78;
  --accent:#3cc7b8; --accent-ink:#7be0d4; --accent-soft:#143532; --on-accent:#05211e;
  --out:#f08b77; --out-soft:#3b201b; --held:#e8b25a; --held-soft:#352a12; --ok:#6fd096; --ok-soft:#173523;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --p0:#17304a; --p0i:#9cc8f2; --p1:#3d241d; --p1i:#f2b19f; --p2:#183522; --p2i:#9fdcae; --p3:#2c2140; --p3i:#cfb2f2;
  --p4:#3a2f10; --p4i:#ecd08a; --p5:#143535; --p5i:#93dcdc; --p6:#3c1d2c; --p6i:#f2a8cb; --p7:#20264a; --p7i:#b2bdf5;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--t-sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--t-mono);font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.bar-in,.page{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:.8rem;font-family:var(--t-mono)}
.brand h1{font-size:1.06rem;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.datenav{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:10px;padding:3px}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:1rem}
.iconbtn:hover{background:var(--surface);color:var(--fg)}
.datelabel{font-weight:600;min-width:8.6em;text-align:center;position:relative;font-size:.92rem}
.datelabel input{position:absolute;inset:0;opacity:0;cursor:pointer}
.btn{border-radius:9px;padding:7px 13px;font-size:.88rem;font-weight:500;border:1px solid var(--line-strong);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--fg)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.who{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px 5px 6px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:.84rem}
.who .dot{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.72rem}

.page{padding-block:16px 56px;display:grid;gap:14px}
.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.notice b{color:var(--fg);font-weight:600}
.notice.demo{background:var(--held-soft);border-color:transparent;color:var(--fg)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border-radius:11px;padding:8px 4px 7px;display:grid;justify-items:center;gap:2px;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.wd:hover{border-color:var(--line-strong)}
.wd .w{font-size:.72rem}
.wd .d{font-family:var(--t-mono);font-weight:600;font-size:1rem;color:var(--fg)}
.wd .c{font-size:.66rem;font-weight:600;color:var(--accent-ink);min-height:1.1em}
.wd.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wd.sel .d,.wd.sel .c{color:var(--on-accent)}
.wd.today:not(.sel) .d{color:var(--accent)}
.wd.sun:not(.sel) .w{color:var(--out)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:.94rem;margin:0;font-weight:700}
.card-h .meta{font-size:.76rem;color:var(--muted)}

/* ---- room grid ---- */
.grid-scroll{overflow-x:auto;overscroll-behavior-x:contain}
.grid{display:grid;grid-template-columns:46px repeat(6,minmax(96px,1fr));min-width:640px}
.gh{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 8px 9px;display:grid;gap:1px;text-align:center}
.gh .rn{font-weight:700;font-size:.86rem}
.gh .rs{font-size:.7rem;color:var(--muted)}
.gh .rs.free{color:var(--ok)}
.times{position:relative}
.times span{position:absolute;right:8px;font-family:var(--t-mono);font-size:.68rem;color:var(--faint);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour))}
.col::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--hour)/2),color-mix(in srgb,var(--line) 50%,transparent) calc(var(--hour)/2) calc(var(--hour)/2 + 1px),transparent calc(var(--hour)/2 + 1px) var(--hour))}
.can-book .col{cursor:copy}
.can-book .col:hover{background-color:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.ghost{position:absolute;left:4px;right:4px;border:1.5px dashed var(--accent);border-radius:8px;color:var(--accent-ink);font-size:.74rem;font-weight:600;padding:3px 7px;pointer-events:none;z-index:1;background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
.bk{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 8px;text-align:left;background:var(--pb);color:var(--pi);overflow:hidden;z-index:2;display:grid;align-content:start;gap:1px;font-size:.78rem;line-height:1.3;cursor:pointer;transition:transform .12s,box-shadow .12s}
.bk:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.bk b{font-weight:700}
.bk .t{font-family:var(--t-mono);font-size:.68rem;opacity:.8}
.bk .x{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.mine{box-shadow:inset 0 0 0 2px var(--pi)}
.bk.mine b::after{content:"우리 조";margin-left:5px;font-size:.62rem;font-weight:700;padding:0 5px;border-radius:99px;background:var(--pi);color:var(--pb);vertical-align:1px}
.bk.past{opacity:.45}
.now{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--out);z-index:3;pointer-events:none}
.now::before{content:attr(data-t);position:absolute;left:-46px;top:-.7em;width:40px;text-align:right;font-family:var(--t-mono);font-size:.66rem;color:var(--out);font-weight:600}
.grid-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:.76rem;color:var(--muted)}

/* ---- kits ---- */
.kits{list-style:none;margin:0;padding:4px 0}
.kr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:6px;padding:7px 16px}
.kr+.kr{border-top:1px solid var(--line)}
.kr .n{font-weight:500;font-size:.88rem}
.set{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px 3px 7px;font-size:.74rem;font-weight:600;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.set i{width:7px;height:7px;border-radius:50%;background:currentColor}
.set.held{background:var(--held-soft);color:var(--held)}
.set.out{background:var(--out-soft);color:var(--out)}
.can-book .set:hover{filter:brightness(.96)}
.kp{grid-column:1/-1;display:grid;gap:6px;background:var(--sunk);border-radius:9px;padding:9px;font-size:.8rem}
.kp .row2{display:flex;gap:6px}
.kp input{flex:1;min-width:0}
.legend{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%}

/* ---- drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(15,25,32,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:41;box-shadow:-12px 0 40px rgba(0,0,0,.12);transform:translateX(102%);transition:transform .22s ease;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:1rem}
.db{overflow-y:auto;padding:18px;display:grid;gap:14px;align-content:start}
.field{display:grid;gap:5px}
.field>span{font-size:.76rem;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:.92rem;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[readonly]{background:var(--sunk)}
.seg{display:grid;gap:4px;background:var(--sunk);padding:3px;border-radius:10px}
.seg.r6{grid-template-columns:repeat(6,1fr)} .seg.r2{grid-template-columns:1fr 1fr}
.seg button{padding:7px 0;border-radius:8px;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button.taken:not([aria-pressed="true"]){color:var(--faint);text-decoration:line-through}
.seg button small{display:block;font-weight:500;font-size:.7rem;color:var(--muted)}
.paste{display:flex;gap:6px}
.paste input{background:var(--sunk);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);border-radius:99px;padding:4px 11px;font-size:.82rem;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.chip small{opacity:.75;margin-left:3px}
.hint{font-size:.78rem;color:var(--muted)}
.alert{border-radius:9px;padding:9px 11px;font-size:.84rem;background:var(--out-soft);color:var(--fg);display:grid;gap:6px}
.alert b{color:var(--out)}
.msg{font-size:.84rem;min-height:1.2em;font-weight:600}
.msg.err{color:var(--out)} .msg.good{color:var(--ok)}
.sep{height:1px;background:var(--line)}
dl.info{display:grid;grid-template-columns:4.5em 1fr;gap:8px 10px;margin:0;font-size:.9rem}
dl.info dt{color:var(--muted)} dl.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bigtime{font-family:var(--t-mono);font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.codein{font-family:var(--t-mono);font-size:1.3rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.86rem;font-weight:500;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){.brand h1{font-size:.98rem}.datelabel{min-width:7.4em}.bar-in{gap:8px}.newlabel{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand"><span class="logo" aria-hidden="true">OS</span><h1>오스키실 예약판</h1></div>
    <div class="datenav">
      <button class="iconbtn" id="prev" type="button" aria-label="이전 날">‹</button>
      <div class="datelabel"><span id="dateText"></span><input type="date" id="datePick" aria-label="날짜 선택"></div>
      <button class="iconbtn" id="next" type="button" aria-label="다음 날">›</button>
    </div>
    <button class="btn ghost sm" id="todayBtn" type="button">오늘</button>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="다크 모드로 바꾸기">☾</button>
    <span id="authSlot"></span>
  </div>
</header>

<main class="page">
  <div class="notice demo" id="demo" hidden>미리보기 모드예요. 예시 신청이 들어 있고 이 브라우저에만 저장돼요. 조장 화면을 보려면 코드 <b class="mono">DEMO-C</b>로 로그인해 보세요.</div>
  <div class="notice" id="viewOnly" hidden><span><b>보기 전용</b> · 신청과 재료 대여는 조장만 할 수 있어요.</span><button class="btn sm" type="button" id="loginInline">조장 로그인</button></div>

  <nav class="week" id="week" aria-label="주간 날짜"></nav>

  <div class="layout" id="layout">
    <section class="card" aria-labelledby="gt">
      <div class="card-h"><h2 id="gt">방별 시간표</h2><span class="meta" id="dayMeta"></span></div>
      <div class="grid-scroll"><div class="grid" id="grid"></div></div>
      <div class="grid-foot" id="gridFoot"></div>
    </section>

    <section class="card" aria-labelledby="kt">
      <div class="card-h"><h2 id="kt">재료 현황</h2><span class="meta mono" id="clock"></span></div>
      <ul class="kits" id="kits"></ul>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>보관중</span>
        <span><i style="background:var(--held)"></i>예약 시간</span>
        <span><i style="background:var(--out)"></i>대여중</span>
      </div>
    </section>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-labelledby="drawerTitle" role="dialog" aria-modal="true">
  <div class="dh"><h2 id="drawerTitle"></h2><button class="iconbtn" id="closeDrawer" type="button" aria-label="닫기">✕</button></div>
  <div class="db" id="drawerBody"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
/* ================= 상수 ================= */
const ROOMS=[1,2,3,4,5,6];
const KITS=[["anes","마취 세트"],["ext","발치"],["sut","봉합"],["tbi","TBI"],["fl","불소도포"],["seal","실란트"],["rd","러버댐"],["srp","SRP"],["ept","EPT"],["probe","치주낭 측정"]];
const KITNAME=Object.fromEntries(KITS);
const SETS=[1,2];
const DURS=[60,120];
const OPEN=8*60, CLOSE=22*60;
const WD=["일","월","화","수","목","금","토"];

/* ================= 유틸 ================= */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmt=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const toMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const overlap=(a,b)=>a.start<b.end&&b.start<a.end;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const teamLabel=b=>[b.day,b.team?b.team+"조":""].filter(Boolean).join(" ");
const kitText=k=>{const [id,s]=k.split("-");return KITNAME[id]+" "+s};
const hourPx=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"))||48;
const palette=t=>{let h=0;for(const c of String(t))h=(h*31+c.charCodeAt(0))>>>0;const i=/^[A-Z]$/.test(t)?(t.charCodeAt(0)-65)%8:h%8;return `--pb:var(--p${i});--pi:var(--p${i}i)`};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
let toastT;function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2600)}

/* ================= 상태 ================= */
const S={sel:ymd(),bookings:[],kits:{},code:"",team:"",openKit:null,draft:null};
const isLeader=()=>!!S.team;

/* ================= 오류 문구 ================= */
function errText(e){
  const m=String(e&&(e.message||e.details||e.code)||"");
  if(m.includes("NOT_LEADER"))return "조장 코드가 맞지 않아요. 다시 로그인해 주세요.";
  if(m.includes("TEAM_BUSY"))return "우리 조는 이 시간에 이미 다른 방을 신청했어요.";
  if(m.includes("KIT_TAKEN"))return "방금 다른 조가 같은 재료 세트를 잡았어요. 재료를 다시 골라 주세요.";
  if(m.includes("BAD_DURATION"))return "사용 시간은 1시간 또는 2시간만 고를 수 있어요.";
  if(m.includes("23P01")||m.includes("no_overlap")||(e&&e.code==="23P01"))return "방금 다른 조가 같은 방·시간을 먼저 잡았어요. 다른 방이나 시간을 골라 주세요.";
  return "저장하지 못했어요. 인터넷 연결을 확인해 주세요.";
}

/* ================= 데이터 계층 ================= */
const cfg=window.OSCE_CONFIG||{};
const LIVE=!!(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&window.supabase);
let api;
const rowToBooking=r=>({id:r.id,date:r.date,room:r.room,start:r.start_min,end:r.end_min,day:r.day_label||"",team:r.team,content:r.content||"",kits:r.kits||[]});

if(LIVE){
  const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  const rpc=async(fn,args)=>{const {data,error}=await sb.rpc(fn,args);if(error){const e=new Error(error.message);e.code=error.code;throw e}return data};
  api={
    async login(code){return await rpc("leader_login",{p_code:code})},
    async loadBookings(){
      const {data,error}=await sb.from("bookings").select("*").gte("date",addDays(ymd(),-14)).order("date").order("start_min").limit(3000);
      if(error)throw error;S.bookings=data.map(rowToBooking);
    },
    async loadKits(){const {data,error}=await sb.from("kits").select("*");if(error)throw error;S.kits=Object.fromEntries(data.map(r=>[r.id,r]))},
    async add(b){return rowToBooking(await rpc("create_booking",{p_code:S.code,p_date:b.date,p_room:b.room,p_start:b.start,p_dur:b.end-b.start,p_day:b.day,p_content:b.content,p_kits:b.kits}))},
    async cancel(id){const ok=await rpc("cancel_booking",{p_code:S.code,p_id:id});if(!ok)throw new Error("우리 조 신청만 취소할 수 있어요.")},
    async setKit(id,status,who){await rpc("set_kit",{p_code:S.code,p_id:id,p_status:status,p_who:who||""})},
    subscribe(){
      let t;const refresh=()=>{clearTimeout(t);t=setTimeout(async()=>{try{await api.loadBookings();await api.loadKits();render()}catch(e){}},150)};
      sb.channel("osce").on("postgres_changes",{event:"*",schema:"public",table:"bookings"},refresh)
        .on("postgres_changes",{event:"*",schema:"public",table:"kits"},refresh).subscribe();
      document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
    }
  };
}else{
  const KEY="osce-demo-v3";
  const seed=()=>{const t=ymd(),tm=addDays(t,1);return {bookings:[
    {id:"e1",date:t,room:1,start:540,end:660,day:"3일차",team:"C",content:"A형 모의고사",kits:["anes-1","ext-1"]},
    {id:"e2",date:t,room:2,start:600,end:720,day:"3일차",team:"A",content:"봉합·발치 반복",kits:["sut-1","ext-2"]},
    {id:"e3",date:t,room:1,start:780,end:840,day:"3일차",team:"F",content:"치주낭 측정",kits:["probe-1"]},
    {id:"e4",date:t,room:4,start:840,end:960,day:"4일차",team:"B",content:"러버댐·실란트",kits:["rd-1","seal-1"]},
    {id:"e5",date:t,room:5,start:1140,end:1260,day:"4일차",team:"D",content:"B형 모의고사",kits:["anes-2","ept-1"]},
    {id:"e6",date:tm,room:3,start:540,end:660,day:"4일차",team:"E",content:"TBI·불소도포",kits:["tbi-1","fl-1"]}
  ],kits:{"sut-2":{status:"out",who:"G조"}}}};
  let db;try{db=JSON.parse(store(KEY)||"null")}catch(e){}
  if(!db)db=seed();
  const save=()=>store(KEY,JSON.stringify(db));
  const demoTeam=c=>{const m=String(c).trim().toUpperCase().match(/^DEMO-([A-H])$/);return m?m[1]:null};
  api={
    async login(code){return demoTeam(code)},
    async loadBookings(){S.bookings=db.bookings.slice()},
    async loadKits(){S.kits={...db.kits}},
    async add(b){
      const team=demoTeam(S.code);if(!team)throw new Error("NOT_LEADER");
      if(db.bookings.some(x=>x.date===b.date&&x.room===b.room&&overlap(x,b)))throw new Error("23P01");
      if(db.bookings.some(x=>x.date===b.date&&x.team===team&&overlap(x,b)))throw new Error("TEAM_BUSY");
      const r={...b,team,id:"d"+Date.now()};db.bookings.push(r);save();S.bookings=db.bookings.slice();return r;
    },
    async cancel(id){const b=db.bookings.find(x=>x.id===id);if(!b||b.team!==S.team)throw new Error("우리 조 신청만 취소할 수 있어요.");db.bookings=db.bookings.filter(x=>x.id!==id);save();S.bookings=db.bookings.slice()},
    async setKit(id,status,who){db.kits[id]={status,who:status==="out"?(who||S.team+"조"):""};save();S.kits={...db.kits}},
    subscribe(){}
  };
}

/* ================= 계산 ================= */
const dayBookings=d=>S.bookings.filter(b=>b.date===d);
function usedSets(d){const u=new Set();S.bookings.filter(b=>b.date===d.date&&overlap(b,d)).forEach(b=>(b.kits||[]).forEach(k=>u.add(k)));return u}
const roomTaken=(d,room)=>S.bookings.filter(b=>b.date===d.date&&b.room===room&&overlap(b,d));
function kitState(kid){
  const k=S.kits[kid];
  if(k&&k.status==="out")return {cls:"out",text:"대여중",sub:k.who||""};
  const t=ymd(),nm=nowMin(),list=dayBookings(t).filter(b=>(b.kits||[]).includes(kid));
  const cur=list.find(b=>b.start<=nm&&nm<b.end);
  if(cur)return {cls:"held",text:"예약",sub:`${teamLabel(cur)} · ${cur.room}번 방 ~${fmt(cur.end)}`};
  const nx=list.filter(b=>b.start>nm).sort((a,b)=>a.start-b.start)[0];
  return {cls:"",text:"보관",sub:nx?`다음 예약 ${fmt(nx.start)} ${teamLabel(nx)}`:"오늘 예약 없음"};
}

/* ================= 렌더: 상단 ================= */
function renderAuth(){
  $("authSlot").innerHTML=isLeader()
    ?`<button class="who" type="button" id="whoBtn" title="로그아웃하려면 누르세요"><span class="dot">${esc(S.team)}</span>${esc(S.team)}조 조장</button> <button class="btn primary" type="button" id="newBtn">+<span class="newlabel"> 연습 신청</span></button>`
    :`<button class="btn" type="button" id="loginBtn">조장 로그인</button>`;
  $("viewOnly").hidden=isLeader();
  $("layout").classList.toggle("can-book",isLeader());
  $("gridFoot").textContent=isLeader()
    ?"빈칸을 누르면 그 방·그 시간으로 신청 창이 열려요. 테두리가 진한 칸이 우리 조 신청이에요."
    :"칸을 누르면 신청 내용을 볼 수 있어요.";
  const nb=$("newBtn");if(nb)nb.onclick=()=>openForm({});
  const lb=$("loginBtn");if(lb)lb.onclick=openLogin;
  const wb=$("whoBtn");if(wb)wb.onclick=openAccount;
}
function renderTop(){
  const d=parseYmd(S.sel);
  $("dateText").textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
  $("datePick").value=S.sel;
  const mon=addDays(S.sel,-((d.getDay()+6)%7)),t=ymd();
  let h="";
  for(let i=0;i<7;i++){const s=addDays(mon,i),x=parseYmd(s),n=dayBookings(s).length;
    h+=`<button type="button" class="wd ${s===S.sel?"sel":""} ${s===t?"today":""} ${x.getDay()===0?"sun":""}" data-date="${s}" aria-label="${x.getMonth()+1}월 ${x.getDate()}일, 신청 ${n}건">
      <span class="w">${WD[x.getDay()]}</span><span class="d">${x.getDate()}</span><span class="c">${n?n+"건":""}</span></button>`}
  $("week").innerHTML=h;
  const list=dayBookings(S.sel);
  $("dayMeta").textContent=list.length?`신청 ${list.length}건 · 하루 비어 있는 방 ${ROOMS.filter(r=>!list.some(b=>b.room===r)).length}개`:"아직 신청 없음";
}

/* ================= 렌더: 방별 시간표 ================= */
function renderGrid(){
  const hp=hourPx(),H=(CLOSE-OPEN)/60,height=H*hp,list=dayBookings(S.sel),t=ymd(),nm=nowMin();
  let h=`<div class="gh"></div>`;
  for(const r of ROOMS){const n=list.filter(b=>b.room===r).length;h+=`<div class="gh"><span class="rn">${r}번 방</span><span class="rs ${n?"":"free"}">${n?n+"건":"비어 있음"}</span></div>`}
  h+=`<div class="times" style="height:${height}px">`;
  for(let i=0;i<=H;i++)h+=`<span style="top:${i*hp}px">${pad(OPEN/60+i)}</span>`;
  h+=`</div>`;
  for(const r of ROOMS){
    h+=`<div class="col" data-room="${r}" style="height:${height}px">`;
    for(const b of list.filter(b=>b.room===r)){
      const top=(b.start-OPEN)/60*hp,ht=(b.end-b.start)/60*hp-3;
      const mine=isLeader()&&b.team===S.team,past=S.sel<t||(S.sel===t&&b.end<=nm);
      h+=`<button type="button" class="bk ${mine?"mine":""} ${past?"past":""}" data-id="${b.id}" style="top:${top+1}px;height:${ht}px;${palette(b.team)}">
        <b>${esc(teamLabel(b))}</b><span class="t">${fmt(b.start)}–${fmt(b.end)}</span>
        ${ht>58?`<span class="x">${esc(b.content)}</span>`:""}</button>`;
    }
    if(S.sel===t&&nm>=OPEN&&nm<=CLOSE)h+=`<div class="now" ${r===1?`data-t="${fmt(nm)}"`:""} style="top:${(nm-OPEN)/60*hp}px"></div>`;
    h+=`</div>`;
  }
  $("grid").innerHTML=h;
}
function slotFrom(e,col){const y=e.clientY-col.getBoundingClientRect().top;let m=OPEN+Math.floor(y/hourPx()*2)*30;return Math.max(OPEN,Math.min(m,CLOSE-60))}
const clearGhost=()=>document.querySelectorAll(".ghost").forEach(g=>g.remove());
$("grid").addEventListener("mousemove",e=>{
  clearGhost();if(!isLeader())return;
  const col=e.target.closest(".col");if(!col||e.target.closest(".bk"))return;
  const m=slotFrom(e,col),room=Number(col.dataset.room);
  const dur=roomTaken({date:S.sel,start:m,end:m+120},room).length?60:120;
  if(roomTaken({date:S.sel,start:m,end:m+dur},room).length)return;
  const g=document.createElement("div");g.className="ghost";g.style.top=((m-OPEN)/60*hourPx()+1)+"px";g.style.height=(dur/60*hourPx()-3)+"px";
  g.textContent="+ "+fmt(m)+" 신청";col.appendChild(g);
});
$("grid").addEventListener("mouseleave",clearGhost);
$("grid").addEventListener("click",e=>{
  const bk=e.target.closest(".bk");if(bk){openDetail(bk.dataset.id);return}
  const col=e.target.closest(".col");if(!col)return;
  if(!isLeader()){toast("신청은 조장만 할 수 있어요");return}
  const m=slotFrom(e,col),room=Number(col.dataset.room);
  const dur=roomTaken({date:S.sel,start:m,end:m+120},room).length?60:120;
  openForm({room,start:fmt(m),dur});
});

/* ================= 렌더: 재료 ================= */
function renderKits(){
  $("clock").textContent=fmt(nowMin())+" 기준";
  let h="";
  for(const [k,n] of KITS){
    h+=`<li class="kr"><span class="n">${n}</span>`;
    for(const s of SETS){const id=k+"-"+s,st=kitState(id);
      h+=`<button type="button" class="set ${st.cls}" data-kit="${id}" title="${esc(st.sub)}" aria-label="${n} ${s}세트: ${st.text}. ${esc(st.sub)}"><i></i>${s} ${st.text}</button>`}
    if(S.openKit&&S.openKit.startsWith(k+"-"))h+=kitPanel(S.openKit);
    h+=`</li>`;
  }
  $("kits").innerHTML=h;
}
function kitPanel(id){
  const st=kitState(id),[k,s]=id.split("-"),title=`<b>${KITNAME[k]} ${s}세트</b> · ${esc(st.sub)}`;
  if(!isLeader())return `<div class="kp"><div>${title}</div><div class="hint">대여·반납은 조장만 할 수 있어요.</div></div>`;
  if(st.cls==="out")return `<div class="kp"><div>${title} 대여중</div>
    <div class="row2"><button class="btn sm primary" type="button" data-act="return" data-id="${id}">반납 처리</button><button class="btn sm ghost" type="button" data-act="close">닫기</button></div></div>`;
  return `<div class="kp"><div>${title}</div>
    <div class="row2"><input id="kpWho" value="${esc(S.team)}조" aria-label="대여하는 조"><button class="btn sm primary" type="button" data-act="lend" data-id="${id}">대여</button><button class="btn sm ghost" type="button" data-act="close">취소</button></div></div>`;
}
$("kits").addEventListener("click",async e=>{
  const set=e.target.closest(".set");if(set){S.openKit=S.openKit===set.dataset.kit?null:set.dataset.kit;renderKits();return}
  const a=e.target.closest("[data-act]");if(!a)return;
  if(a.dataset.act==="close"){S.openKit=null;renderKits();return}
  a.disabled=true;
  try{
    if(a.dataset.act==="lend"){await api.setKit(a.dataset.id,"out",($("kpWho").value||"").trim());toast("대여로 표시했어요")}
    if(a.dataset.act==="return"){await api.setKit(a.dataset.id,"in","");toast("반납 처리했어요")}
    S.openKit=null;await api.loadKits();renderKits();
  }catch(err){toast(errText(err));a.disabled=false}
});
$("kits").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="kpWho"){e.preventDefault();e.target.parentElement.querySelector('[data-act="lend"]').click()}});

/* ================= 서랍 ================= */
function openDrawer(title){$("drawerTitle").textContent=title;$("drawer").classList.add("on");$("scrim").classList.add("on")}
function closeDrawer(){$("drawer").classList.remove("on");$("scrim").classList.remove("on")}
$("closeDrawer").onclick=closeDrawer;$("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});

/* ---- 조장 로그인 ---- */
function openLogin(){
  openDrawer("조장 로그인");
  $("drawerBody").innerHTML=`
    <p class="hint" style="margin:0">조장에게 받은 코드를 입력하세요. 한 번 로그인하면 이 기기에서 계속 유지돼요. 조원은 로그인 없이 시간표를 볼 수 있어요.</p>
    <input class="codein" id="codeIn" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="코드" aria-label="조장 코드">
    <div class="msg" id="lMsg"></div>
    <button class="btn primary" type="button" id="codeGo">로그인</button>`;
  const go=async()=>{const c=$("codeIn").value.trim();if(!c){$("codeIn").focus();return}
    $("codeGo").disabled=true;
    try{const team=await api.login(c);
      if(!team){$("lMsg").className="msg err";$("lMsg").textContent="코드가 맞지 않아요. 대소문자 상관없이 다시 확인해 주세요.";$("codeGo").disabled=false;return}
      S.code=c.toUpperCase();S.team=team;store("osce-code",S.code);store("osce-team",team);
      closeDrawer();render();toast(team+"조 조장으로 로그인했어요");
    }catch(err){$("lMsg").className="msg err";$("lMsg").textContent="확인하지 못했어요. 인터넷 연결을 확인해 주세요.";$("codeGo").disabled=false}};
  $("codeGo").onclick=go;$("codeIn").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};
  setTimeout(()=>$("codeIn").focus(),230);
}
function openAccount(){
  const mine=S.bookings.filter(b=>b.team===S.team&&b.date>=ymd()).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
  openDrawer(S.team+"조 조장");
  $("drawerBody").innerHTML=`
    <div class="field"><span>우리 조 다가오는 신청</span>
    ${mine.length?mine.map(b=>{const d=parseYmd(b.date);return `<button class="btn" type="button" data-open="${b.id}" style="text-align:left">${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]}) <span class="mono">${fmt(b.start)}–${fmt(b.end)}</span> · ${b.room}번 방</button>`}).join(""):`<span class="hint">아직 없어요.</span>`}</div>
    <div class="sep"></div>
    <button class="btn" type="button" id="logout">로그아웃</button>`;
  $("drawerBody").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const x=S.bookings.find(y=>y.id===b.dataset.open);S.sel=x.date;render();openDetail(x.id)});
  $("logout").onclick=()=>{S.code="";S.team="";store("osce-code",null);store("osce-team",null);closeDrawer();render();toast("로그아웃했어요")};
}

/* ---- 신청 폼 ---- */
function openForm(pre={}){
  if(!isLeader()){openLogin();return}
  S.draft={day:pre.day??store("osce-day")??"",date:pre.date||S.sel,room:pre.room||1,start:pre.start||"09:00",dur:DURS.includes(pre.dur)?pre.dur:120,content:pre.content||"",kits:new Set()};
  openDrawer("연습 신청");drawForm();
}
const draftRange=()=>{const d=S.draft,s=toMin(d.start);return {date:d.date,start:s,end:s+d.dur,room:d.room}};
function drawForm(){
  const d=S.draft,r=draftRange();
  const taken=new Set(ROOMS.filter(x=>roomTaken(r,x).length));
  const used=usedSets(r),clash=roomTaken(r,d.room),freeAlt=ROOMS.filter(x=>!taken.has(x));
  const teamBusy=S.bookings.find(b=>b.date===r.date&&b.team===S.team&&overlap(b,r));
  $("drawerBody").innerHTML=`
  <div class="field"><span>카톡 양식 붙여넣기 (선택)</span>
    <div class="paste"><input id="fPaste" placeholder="3일차 c조 10/15 오전 9시 3번방 a형 모의고사"><button class="btn sm" type="button" id="fParse">채우기</button></div></div>
  <div class="sep"></div>
  <div class="two">
    <label class="field"><span>조</span><input value="${esc(S.team)}조" readonly></label>
    <label class="field"><span>일차</span><input id="fDay" value="${esc(d.day)}" placeholder="3일차"></label>
  </div>
  <div class="two">
    <label class="field"><span>날짜</span><input id="fDate" type="date" value="${d.date}"></label>
    <label class="field"><span>시작</span><input id="fStart" type="time" step="1800" value="${d.start}"></label>
  </div>
  <div class="field"><span>사용 시간</span>
    <div class="seg r2" id="fDur">${DURS.map(m=>`<button type="button" data-dur="${m}" aria-pressed="${m===d.dur}">${m/60}시간<small>~${fmt(r.start+m)}</small></button>`).join("")}</div></div>
  <div class="field"><span>방</span>
    <div class="seg r6">${ROOMS.map(x=>`<button type="button" data-room="${x}" aria-pressed="${x===d.room}" class="${taken.has(x)?"taken":""}" ${taken.has(x)?`title="이 시간에 이미 신청 있음"`:""}>${x}</button>`).join("")}</div></div>
  ${clash.length?`<div class="alert"><div><b>${d.room}번 방은 이 시간에 이미 신청이 있어요.</b><br>${clash.map(b=>`${esc(teamLabel(b))} ${fmt(b.start)}–${fmt(b.end)}`).join("<br>")}</div>
    ${freeAlt.length?`<div>비어 있는 방: ${freeAlt.map(x=>`<button class="btn sm" type="button" data-room="${x}">${x}번</button>`).join(" ")}</div>`:`<div>이 시간엔 모든 방이 찼어요. 시간을 바꿔 주세요.</div>`}</div>`:""}
  ${teamBusy?`<div class="alert"><div><b>우리 조는 이 시간에 이미 ${teamBusy.room}번 방을 신청했어요.</b> (${fmt(teamBusy.start)}–${fmt(teamBusy.end)})</div></div>`:""}
  <label class="field"><span>연습내용</span><input id="fContent" value="${esc(d.content)}" placeholder="A형 모의고사"></label>
  <div class="field"><span>쓸 재료</span>
    <div class="chips" id="fKits">${KITS.map(([k,n])=>{const left=SETS.filter(s=>!used.has(k+"-"+s)).length;if(!left)d.kits.delete(k);
      return `<button type="button" class="chip" data-k="${k}" aria-pressed="${d.kits.has(k)}" ${left?"":"disabled title='이 시간대 2세트 모두 예약됨'"}>${n}${left===1?"<small>1세트 남음</small>":""}</button>`}).join("")}</div>
    <span class="hint">남는 세트(1 또는 2)로 자동 배정돼요.</span></div>
  <div class="msg" id="fMsg"></div>
  <button class="btn primary" type="button" id="fSubmit" ${clash.length||teamBusy?"disabled":""}>${d.room}번 방 · ${fmt(r.start)}–${fmt(r.end)} 신청</button>`;
  bindForm();
}
function readForm(){const d=S.draft;d.day=$("fDay").value.trim();d.date=$("fDate").value||d.date;d.start=$("fStart").value||d.start;d.content=$("fContent").value.trim()}
function bindForm(){
  ["fDate","fStart"].forEach(id=>$(id).addEventListener("change",()=>{readForm();drawForm()}));
  $("drawerBody").querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>{readForm();S.draft.room=Number(b.dataset.room);drawForm()});
  $("fDur").onclick=e=>{const b=e.target.closest("[data-dur]");if(!b)return;readForm();S.draft.dur=Number(b.dataset.dur);drawForm()};
  $("fKits").onclick=e=>{const c=e.target.closest("[data-k]");if(!c||c.disabled)return;const k=c.dataset.k;S.draft.kits.has(k)?S.draft.kits.delete(k):S.draft.kits.add(k);c.setAttribute("aria-pressed",S.draft.kits.has(k))};
  $("fParse").onclick=()=>{const p=parseKakao($("fPaste").value);readForm();
    if(!Object.keys(p).length){setMsg("양식을 읽지 못했어요. 직접 입력해 주세요.","err");return}
    const other=p.team&&p.team!==S.team;delete p.team;
    Object.assign(S.draft,p);drawForm();
    setMsg(other?"다른 조 이름이 있었지만 신청은 우리 조로 들어가요.":"양식에서 채웠어요. 사용 시간과 재료만 확인하세요.",other?"err":"good")};
  $("fPaste").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("fParse").click()}};
  $("fSubmit").onclick=submit;
}
function setMsg(t,c){const m=$("fMsg");if(m){m.textContent=t;m.className="msg "+(c||"")}}
async function submit(){
  readForm();const d=S.draft,r=draftRange();
  if(r.start<OPEN||r.end>CLOSE){setMsg("08:00–22:00 사이로만 신청할 수 있어요.","err");return}
  if(roomTaken(r,d.room).length){drawForm();return}
  const used=usedSets(r),kits=[];
  for(const k of d.kits){const s=SETS.find(s=>!used.has(k+"-"+s));if(!s){setMsg(KITNAME[k]+"는 이 시간대에 남는 세트가 없어요.","err");return}kits.push(k+"-"+s)}
  $("fSubmit").disabled=true;
  try{
    const b=await api.add({date:r.date,room:d.room,start:r.start,end:r.end,day:d.day,content:d.content,kits});
    store("osce-day",d.day);
    await api.loadBookings();S.sel=r.date;render();openDetail(b.id,true);
  }catch(err){setMsg(errText(err),"err");$("fSubmit").disabled=false;try{await api.loadBookings();render()}catch(e){}}
}

/* ---- 상세 ---- */
function openDetail(id,justMade){
  const b=S.bookings.find(x=>x.id===id);if(!b)return;
  const d=parseYmd(b.date),mine=isLeader()&&b.team===S.team;
  const kakao=`${b.day?b.day+" ":""}${b.team}조 ${d.getMonth()+1}/${d.getDate()} ${fmt(b.start)}-${fmt(b.end)} 오스키실 ${b.room}번방 ${b.content}`.trim();
  openDrawer(justMade?"신청 완료":"신청 내용");
  $("drawerBody").innerHTML=`
    <div><div class="hint">${b.room}번 방 · ${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})</div>
    <div class="bigtime">${fmt(b.start)}–${fmt(b.end)}</div></div>
    <dl class="info">
      <dt>조</dt><dd>${esc(teamLabel(b))}</dd>
      <dt>연습</dt><dd>${esc(b.content||"-")}</dd>
      <dt>재료</dt><dd>${(b.kits||[]).map(k=>esc(kitText(k))+"세트").join(", ")||"없음"}</dd>
    </dl>
    ${mine?`<div class="sep"></div>
    <div class="field"><span>조원 카톡에 공유할 문구</span>
      <div class="paste"><input id="kakaoLine" readonly value="${esc(kakao)}"><button class="btn sm" type="button" id="copyBtn">복사</button></div></div>
    <div id="cancelZone"><button class="btn" type="button" id="cancelBtn">신청 취소</button></div>`:""}`;
  const cp=$("copyBtn");
  if(cp)cp.onclick=async()=>{const i=$("kakaoLine");try{await navigator.clipboard.writeText(i.value);toast("복사했어요")}catch(e){i.select();toast("선택했어요. 길게 눌러 복사하세요")}};
  const c=$("cancelBtn");
  if(c)c.onclick=()=>{
    $("cancelZone").innerHTML=`<div class="alert"><div>이 신청을 취소할까요? 시간표에서 바로 사라져요.</div><div style="display:flex;gap:6px"><button class="btn sm primary" type="button" id="cYes">취소하기</button><button class="btn sm ghost" type="button" id="cNo">그대로 두기</button></div></div>`;
    $("cNo").onclick=()=>openDetail(id);
    $("cYes").onclick=async()=>{try{await api.cancel(id);await api.loadBookings();render();closeDrawer();toast("신청을 취소했어요")}catch(err){toast(err.message.includes("우리 조")?err.message:errText(err))}};
  };
}

/* ================= 카톡 양식 파서 ================= */
function parseKakao(s){
  s=(s||"").trim();if(!s)return {};
  const r={};let m;
  if(m=s.match(/(\d+)\s*일차/))r.day=m[1]+"일차";
  if(m=s.match(/([A-Za-z0-9가-힣])\s*[팀조]/))r.team=m[1].toUpperCase();
  if(m=s.match(/(\d{1,2})\s*[\/.월]\s*(\d{1,2})/))r.date=new Date().getFullYear()+"-"+pad(m[1])+"-"+pad(m[2]);
  const tm=s.match(/(오전|오후)?\s*(\d{1,2})\s*(?:시\s*(반|(\d{1,2})\s*분)?|:(\d{2}))(?:\s*[-~]\s*(오전|오후)?\s*(\d{1,2})\s*(?:시|:(\d{2})))?/);
  if(tm){let h=Number(tm[2]);const mi=tm[3]==="반"?30:Number(tm[4]||tm[5]||0);
    if(tm[1]==="오후"&&h<12)h+=12;if(!tm[1]&&h>=1&&h<=7)h+=12;r.start=pad(h)+":"+pad(mi);
    if(tm[7]){let h2=Number(tm[7]);if(tm[6]==="오후"&&h2<12)h2+=12;else if(h2<h&&h2+12>h)h2+=12;
      const dur=h2*60+Number(tm[8]||0)-(h*60+mi);if(DURS.includes(dur))r.dur=dur}}
  if(m=s.match(/(\d)\s*번\s*방?/)||s.match(/방\s*(\d)/)){const n=Number(m[1]);if(n>=1&&n<=6)r.room=n}
  if(tm){let rest=s.slice(s.indexOf(tm[0])+tm[0].length);
    rest=rest.replace(/오스키실|osce실/gi,"").replace(/\d\s*번\s*방?|방\s*\d/,"").trim();if(rest)r.content=rest}
  return r;
}
window.__parseKakao=parseKakao;

/* ================= 상단 이벤트 ================= */
function go(d){S.sel=d;render()}
$("prev").onclick=()=>go(addDays(S.sel,-1));
$("next").onclick=()=>go(addDays(S.sel,1));
$("todayBtn").onclick=()=>go(ymd());
$("datePick").onchange=e=>{if(e.target.value)go(e.target.value)};
$("week").onclick=e=>{const b=e.target.closest("[data-date]");if(b)go(b.dataset.date)};
$("loginInline").onclick=openLogin;
function syncThemeBtn(){const dark=document.documentElement.getAttribute("data-theme")==="dark";$("themeBtn").textContent=dark?"☀":"☾";$("themeBtn").setAttribute("aria-label",dark?"밝은 모드로 바꾸기":"다크 모드로 바꾸기")}
$("themeBtn").onclick=()=>{const next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);store("osce-theme",next);syncThemeBtn()};

function render(){renderAuth();renderTop();renderGrid();renderKits()}

/* ================= 시작 ================= */
(async function boot(){
  if(!document.documentElement.getAttribute("data-theme"))document.documentElement.setAttribute("data-theme",store("osce-theme")||"light");
  syncThemeBtn();
  S.code=store("osce-code")||"";S.team=store("osce-team")||"";
  if(!LIVE)$("demo").hidden=false;
  render();
  try{
    if(S.code){const t=await api.login(S.code);if(t){S.team=t;store("osce-team",t)}else{S.code="";S.team="";store("osce-code",null);store("osce-team",null)}}
    await api.loadBookings();await api.loadKits();
  }catch(e){toast("데이터를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.")}
  render();
  const g=document.querySelector(".grid"),target=(Math.min(Math.max(nowMin(),OPEN),CLOSE)-OPEN)/60*hourPx()-hourPx();
  if(g&&target>240)window.scrollTo({top:g.getBoundingClientRect().top+window.scrollY+target-140,behavior:"auto"});
  api.subscribe();
  setInterval(()=>{renderKits();if(S.sel===ymd())renderGrid()},60000);
})();
})();
</script>

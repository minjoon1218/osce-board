<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오스키실 예약판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="teams.js"></script>
<script>
/* 테마: 기본은 밝게, 다크는 버튼으로 따로 */
(function(){var t="light";try{t=localStorage.getItem("osce-theme")||"light"}catch(e){}document.documentElement.setAttribute("data-theme",t)})();
</script>
<style>
/* Layout: 흰 상단 바(날짜·조장 로그인·테마) → 주간 줄 → 방 1–6 × 시간 격자(조별 파스텔) + 재료 현황. 신청·상세·로그인은 오른쪽 서랍 */
:root{
  color-scheme:light;
  --bg:#f5f8fa; --surface:#ffffff; --sunk:#f0f4f7; --line:#e6ecf0; --line-strong:#d2dbe1;
  --fg:#16212a; --muted:#64737f; --faint:#a3b0ba;
  --accent:#0fa394; --accent-ink:#0b7f74; --accent-soft:#e2f6f3; --on-accent:#ffffff;
  --out:#e04f3a; --out-soft:#fdebe7; --held:#d48a0b; --held-soft:#fdf3dd; --ok:#22a05a; --ok-soft:#e3f6ea;
  --shadow:0 1px 2px rgba(22,40,55,.04),0 6px 20px rgba(22,40,55,.06);
  /* 조별 파스텔 (bg / ink) */
  --p0:#e3f1ff; --p0i:#1f5f9e; --p1:#ffe9e3; --p1i:#a1442d; --p2:#e5f7e8; --p2i:#2b7a3e; --p3:#f3e8ff; --p3i:#6b3fa0;
  --p4:#fff4d6; --p4i:#8a6200; --p5:#e0f6f6; --p5i:#1d7272; --p6:#ffe6f1; --p6i:#a3326a; --p7:#ebeefe; --p7i:#3d4fa8;
  --t-sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --t-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hour:48px; --r:12px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1316; --surface:#151c20; --sunk:#1b2328; --line:#232d33; --line-strong:#34414a;
  --fg:#e8eef2; --muted:#93a2ad; --faint:#5f6e78;
  --accent:#3cc7b8; --accent-ink:#7be0d4; --accent-soft:#143532; --on-accent:#05211e;
  --out:#f08b77; --out-soft:#3b201b; --held:#e8b25a; --held-soft:#352a12; --ok:#6fd096; --ok-soft:#173523;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --p0:#17304a; --p0i:#9cc8f2; --p1:#3d241d; --p1i:#f2b19f; --p2:#183522; --p2i:#9fdcae; --p3:#2c2140; --p3i:#cfb2f2;
  --p4:#3a2f10; --p4i:#ecd08a; --p5:#143535; --p5i:#93dcdc; --p6:#3c1d2c; --p6i:#f2a8cb; --p7:#20264a; --p7i:#b2bdf5;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--t-sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--t-mono);font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.bar-in,.page{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.tabs{display:inline-flex;gap:2px;background:var(--sunk);padding:3px;border-radius:10px;flex:none}
.tabs a{padding:5px 12px;border-radius:8px;font-size:.84rem;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs a:not([aria-current]):hover{color:var(--accent-ink)}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:.8rem;font-family:var(--t-mono)}
.brand h1{font-size:1.06rem;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.datenav{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:10px;padding:3px}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:1rem}
.iconbtn:hover{background:var(--surface);color:var(--fg)}
.datelabel{font-weight:600;min-width:8.6em;text-align:center;position:relative;font-size:.92rem}
.datelabel input{position:absolute;inset:0;opacity:0;cursor:pointer}
.btn{border-radius:9px;padding:7px 13px;font-size:.88rem;font-weight:500;border:1px solid var(--line-strong);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--fg)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.who{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px 5px 6px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:.84rem}
.who .dot{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.72rem}

.page{padding-block:16px 56px;display:grid;gap:14px}
.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.notice b{color:var(--fg);font-weight:600}
.notice.demo{background:var(--held-soft);border-color:transparent;color:var(--fg)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk-lbl{grid-column:1/-1;font-size:.72rem;font-weight:700;color:var(--muted);margin:2px 0 -2px 2px}
.wk-lbl.next{margin-top:6px}
.wd.unopen:not(.sel){opacity:.55}
.wd.sat:not(.sel) .w{color:#3b6fd6}
.teamleg{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.teamleg .lb{font-size:.74rem;font-weight:600;color:var(--muted);margin-right:2px}
.tchip{display:inline-flex;align-items:center;font-size:.74rem;font-weight:700;border-radius:6px;padding:1px 8px 1px 6px;background:var(--pb);color:var(--pi);border-left:4px solid var(--ps)}
.tchip.me{box-shadow:0 0 0 2px var(--ps)}
@media (max-width:600px){.wd{padding:5px 2px 4px}.wd .d{font-size:.9rem}.wd .c{font-size:.6rem}}
.wd{border-radius:11px;padding:8px 4px 7px;display:grid;justify-items:center;gap:2px;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.wd:hover{border-color:var(--line-strong)}
.wd .w{font-size:.72rem}
.wd .d{font-family:var(--t-mono);font-weight:600;font-size:1rem;color:var(--fg)}
.wd .c{font-size:.66rem;font-weight:600;color:var(--accent-ink);min-height:1.1em}
.wd.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wd.sel .d,.wd.sel .c{color:var(--on-accent)}
.wd.today:not(.sel) .d{color:var(--accent)}
.wd.sun:not(.sel) .w{color:var(--out)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:.94rem;margin:0;font-weight:700}
.card-h .meta{font-size:.76rem;color:var(--muted)}

/* ---- room grid ---- */
.grid-scroll{overflow-x:auto;overscroll-behavior-x:contain}
.grid{display:grid;grid-template-columns:46px repeat(6,minmax(96px,1fr));min-width:640px}
.gh{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 8px 9px;display:grid;gap:1px;text-align:center}
.gh .rn{font-weight:700;font-size:.86rem}
.gh .rs{font-size:.7rem;color:var(--muted)}
.gh .rs.free{color:var(--ok)}
.times{position:relative}
.times span{position:absolute;right:8px;font-family:var(--t-mono);font-size:.68rem;color:var(--faint);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour))}
.col::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--hour)/2),color-mix(in srgb,var(--line) 50%,transparent) calc(var(--hour)/2) calc(var(--hour)/2 + 1px),transparent calc(var(--hour)/2 + 1px) var(--hour))}
.can-book .col{cursor:copy}
.can-book .col:hover{background-color:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.slot-ghost{position:absolute;left:4px;right:4px;border:1.5px dashed var(--accent);border-radius:8px;color:var(--accent-ink);font-size:.74rem;font-weight:600;padding:3px 7px;pointer-events:none;z-index:1;background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
.bk{position:absolute;left:4px;right:4px;border-radius:8px;border-left:4px solid var(--ps);padding:5px 8px;text-align:left;background:var(--pb);color:var(--pi);overflow:hidden;z-index:2;display:grid;align-content:start;gap:1px;font-size:.78rem;line-height:1.3;cursor:pointer;transition:transform .12s,box-shadow .12s}
.bk:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.bk b{font-weight:700}
.bk .t{font-family:var(--t-mono);font-size:.68rem;opacity:.8}
.bk .x{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.mine{box-shadow:inset 0 0 0 2px var(--pi)}
.bk.mine b::after{content:"우리 조";margin-left:5px;font-size:.62rem;font-weight:700;padding:0 5px;border-radius:99px;background:var(--pi);color:var(--pb);vertical-align:1px}
.bk.past{opacity:.45}
.bk .fx{font-size:.6rem;font-weight:700;padding:0 5px;border-radius:99px;background:var(--pi);color:var(--pb);margin-left:4px;vertical-align:1px}
.fx-tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--held-soft);color:var(--held)}
.fx-item{display:grid;gap:4px;border:1px solid var(--line);border-left:4px solid var(--ps);border-radius:9px;padding:8px 10px;font-size:.84rem}
.fx-item .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fx-res{font-size:.8rem;line-height:1.5;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px;max-height:160px;overflow:auto}
.tg.wk button{padding:4px 8px}
.now{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--out);z-index:3;pointer-events:none}
.now::before{content:attr(data-t);position:absolute;left:-46px;top:-.7em;width:40px;text-align:right;font-family:var(--t-mono);font-size:.66rem;color:var(--out);font-weight:600}
.grid-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:.76rem;color:var(--muted)}

/* ---- kits ---- */
.kits{list-style:none;margin:0;padding:4px 0}
.kr{display:grid;gap:4px;padding:8px 16px}
.kline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;min-width:0}
.ktimes{font-size:.72rem;color:var(--muted);line-height:1.35;min-width:0}
.ktimes span{white-space:nowrap}
.ktimes .mono{font-size:.7rem;color:var(--fg)}
.kr+.kr{border-top:1px solid var(--line)}
.kr .n{font-weight:500;font-size:.88rem}
.set{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px 3px 7px;font-size:.74rem;font-weight:600;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.set i{width:7px;height:7px;border-radius:50%;background:currentColor}
.set.held{background:var(--held-soft);color:var(--held)}
.set.out{background:var(--out-soft);color:var(--out)}
.can-book .set:hover{filter:brightness(.96)}
.kp{grid-column:1/-1;display:grid;gap:6px;background:var(--sunk);border-radius:9px;padding:9px;font-size:.8rem}
.kp .row2{display:flex;gap:6px}
.kp input{flex:1;min-width:0}
.legend{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%}

/* ---- drawer ---- */
.scrim{position:fixed;inset:0;background:rgba(15,25,32,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:41;box-shadow:-12px 0 40px rgba(0,0,0,.12);transform:translateX(102%);transition:transform .22s ease;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:1rem}
.db{overflow-y:auto;overflow-x:hidden;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-width:0}
.field{display:grid;gap:5px}
.field>span{font-size:.76rem;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input,select{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:.92rem;width:100%;min-width:0}
/* 모바일 좌우 흔들림 방지: iOS 날짜·시간 칸이 칸 너비를 넘지 않게 */
html,body{overflow-x:clip;max-width:100%}
@supports not (overflow-x:clip){body{overflow-x:hidden}}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-height:38px;max-width:100%;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.field{min-width:0}
/* iPhone은 16px보다 작은 입력칸을 누르면 화면을 확대해서 좌우로 밀림 */
@media (max-width:700px){input,select,textarea{font-size:16px}}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[readonly]{background:var(--sunk)}
.seg{display:grid;gap:4px;background:var(--sunk);padding:3px;border-radius:10px}
.seg.r6{grid-template-columns:repeat(6,1fr)} .seg.r2{grid-template-columns:1fr 1fr} .seg.r3{grid-template-columns:repeat(3,1fr)} .added{border:1px solid var(--line,#ddd);border-radius:10px;padding:10px;display:grid;gap:8px;font-size:13px} .added-list{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 0;border-radius:8px;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button.taken:not([aria-pressed="true"]){color:var(--faint);text-decoration:line-through}
.seg button small{display:block;font-weight:500;font-size:.7rem;color:var(--muted)}
.paste{display:flex;gap:6px}
.paste input{background:var(--sunk);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);border-radius:99px;padding:4px 11px;font-size:.82rem;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.chip small{opacity:.75;margin-left:3px}
.hint{font-size:.78rem;color:var(--muted)}
.alert{border-radius:9px;padding:9px 11px;font-size:.84rem;background:var(--out-soft);color:var(--fg);display:grid;gap:6px}
.alert b{color:var(--out)}
.msg{font-size:.84rem;min-height:1.2em;font-weight:600}
.msg.err{color:var(--out)} .msg.good{color:var(--ok)}
.sep{height:1px;background:var(--line)}
dl.info{display:grid;grid-template-columns:4.5em 1fr;gap:8px 10px;margin:0;font-size:.9rem}
dl.info dt{color:var(--muted)} dl.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bigtime{font-family:var(--t-mono);font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.codein{font-family:var(--t-mono);font-size:1.3rem;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.86rem;font-weight:500;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---- notices / admin / rooms ---- */
.ntc.using{background:var(--accent-soft);border-color:transparent;align-items:center}
.ntc.using .tag{background:var(--accent);color:var(--on-accent)}
.ntc.using .body{flex:1}
.adj{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:stretch}
.adj .lbl{font-size:.78rem;font-weight:600;color:var(--muted);align-self:center;padding-right:4px}
.adj button{display:grid;gap:1px;justify-items:center;padding:7px 6px}
.adj button small{font-size:.7rem;font-weight:500;color:var(--muted);font-family:var(--t-mono)}
.adj button:disabled small{font-family:var(--t-sans)}
.adj button.ext:not(:disabled){border-color:var(--accent);color:var(--accent-ink)}
.mealband,.walkband{position:absolute;left:0;right:0;z-index:0;pointer-events:none}
.mealband{background:color-mix(in srgb,var(--held) 9%,transparent)}
.walkband{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ok) 9%,transparent) 0 8px,transparent 8px 16px);border-top:1px dashed color-mix(in srgb,var(--ok) 55%,transparent);border-bottom:1px dashed color-mix(in srgb,var(--ok) 55%,transparent)}
.mealband span,.walkband span{position:absolute;left:3px;top:2px;font-size:.62rem;font-weight:700;line-height:1.2;color:var(--held);opacity:.9}
.walkband span{color:var(--ok)}
.hint.ok{color:var(--ok);font-weight:600}
.blockband{position:absolute;left:0;right:0;z-index:2;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--out) 14%,transparent) 0 6px,color-mix(in srgb,var(--out) 6%,transparent) 6px 12px);border-top:2px solid var(--out);border-bottom:2px solid var(--out);pointer-events:none}
.blockband span{position:absolute;top:4px;left:4px;right:4px;font-size:.7rem;font-weight:700;color:var(--out);background:var(--surface);border-radius:6px;padding:2px 5px;text-align:center;overflow-wrap:anywhere}
.ntc.block{background:var(--out-soft);border-color:transparent}
.ntc.block .tag{background:var(--out);color:#fff}
.blk-list{display:grid;gap:6px}
.u-row{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:6px;align-items:center;font-size:.84rem}
.u-row input,.u-row select{padding:6px 6px;min-width:0}
.u-row .tm{font-size:.74rem;color:var(--muted)}
.u-head{font-size:.72rem;color:var(--muted)}

<script>
(function(){
"use strict";
/* ================= 상수 ================= */
const ROOMS=[1,2,3,4,5,6];
const KITS=[["anes","마취 세트"],["ext","발치"],["sut","봉합"],["tbi","TBI"],["fl","불소도포"],["seal","실란트"],["rd","러버댐"],["srp","SRP"],["ept","EPT"],["probe","치주낭 측정"]];
const KITNAME=Object.fromEntries(KITS);
const KITSHORT={anes:"마취",ext:"발치",sut:"봉합",tbi:"TBI",fl:"불소",seal:"실란트",rd:"러버댐",srp:"SRP",ept:"EPT",probe:"치주낭"};
const SETS=[1,2];
const DURS=[60,120];
const OPEN=7*60, CLOSE=23*60;   /* 운영 07:00–23:00 */
const ROLLOVER=21;   /* 매일 21:00 + 일차별 시차(open_offsets)에 다음 날 오픈 */
const MAXLEN=180;    /* 같은 방 연속 사용 최대 3시간 (연장 포함) */
const WD=["일","월","화","수","목","금","토"];

/* ================= 유틸 ================= */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmt=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const toMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const overlap=(a,b)=>a.start<b.end&&b.start<a.end;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const teamLabel=b=>[b.day,b.team?b.team+"조":""].filter(Boolean).join(" ");
const kitText=k=>{const [id,s]=k.split("-");return KITNAME[id]+" "+s};
const kitShort=k=>{const [id,s]=k.split("-");return KITSHORT[id]+s};
const md=s=>{const d=parseYmd(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const hourPx=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"))||48;
const palette=t=>window.OSCETeams.style(t);
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
let toastT;function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2600)}

/* ================= 상태 ================= */
const S={sel:ymd(),bookings:[],kits:{},rooms:{},notice:"",blocks:[],code:"",role:"",team:"",openKit:null,draft:null};
const isLeader=()=>S.role==="leader";
const isAdmin=()=>S.role==="admin";
const canAct=()=>isLeader()||isAdmin();
const roomInfo=r=>S.rooms[r]||{thomas:true,open:true,memo:""};

/* ---- 일차별 오픈 순서 · 단위(같이 연습하는 조 묶음) ---- */
const ruleOf=t=>(S.rules||{})[t]||null;
const unitOf=t=>(ruleOf(t)&&ruleOf(t).unit)||t;
function offsetOf(t){if(!t)return 0;const r=ruleOf(t),o=S.offsets||{};
  if(r&&r.open_offset!=null)return r.open_offset;if(r&&r.exam_day!=null&&o[r.exam_day]!=null)return o[r.exam_day];return o[0]??0}
const myTeam=()=>isLeader()?S.team:null;
/* day 날짜의 오픈 시각(그날 밤 21:00+시차 → 다음 날 신청 열림) */
function rollAt(day,team){const d=parseYmd(day);d.setHours(ROLLOVER,0,0,0);d.setMinutes(offsetOf(team));return d}
const openHM=team=>{const m=ROLLOVER*60+offsetOf(team);return fmt(m)};
/* ---- 예약 가능 기간: 평소엔 오늘까지, 매일 21:00(+일차별 시차)에 다음 날 오픈 + 관리자가 따로 연 날짜(open_dates) ---- */
function lastBookable(team=myTeam()){const n=new Date();let last=addDays(ymd(n),n>=rollAt(ymd(n),team)?1:0);
  for(const o of S.openDates||[])if(new Date(o.opens_at)<=n&&o.date>last)last=o.date;return last}
/* 다음에 열리는 날짜와 시각 {date, at:Date} */
function nextOpen(team=myTeam()){const n=new Date(),last=lastBookable(team),c=[];
  let base=ymd(n);if(n>=rollAt(base,team))base=addDays(base,1);
  while(addDays(base,1)<=last)base=addDays(base,1);
  c.push({date:addDays(base,1),at:rollAt(base,team)});
  for(const o of S.openDates||[]){const at=new Date(o.opens_at);if(at>n&&o.date>last)c.push({date:o.date,at})}
  c.sort((a,b)=>a.at-b.at);return c[0]}
function whenText(at){const n=new Date(),d=ymd(at),hm=pad(at.getHours())+":"+pad(at.getMinutes());
  return (d===ymd(n)?"오늘":d===addDays(ymd(n),1)?"내일":md(d))+" "+hm}
function openTimeFor(date,team=myTeam()){const o=(S.openDates||[]).find(x=>x.date===date);
  const rule=rollAt(addDays(date,-1),team);
  if(o){const at=new Date(o.opens_at);return at<rule?at:rule}return rule}
/* 오픈 순서 문구: "21:00 1·2일차 → 21:10 3일차 → … → 21:40 나머지" */
function openOrderText(){const o=S.offsets||{},g={};
  Object.entries(o).forEach(([d,m])=>{if(Number(d)>0)(g[m]=g[m]||[]).push(Number(d))});
  const parts=Object.keys(g).map(Number).sort((a,b)=>a-b).map(m=>`${fmt(ROLLOVER*60+m)} ${g[m].sort((a,b)=>a-b).join("·")}일차`);
  if(o[0]!=null)parts.push(`${fmt(ROLLOVER*60+o[0])} 나머지`);
  return parts.length?parts.join(" → "):"21:00"}
/* ---- 단위별 하루 상한 · 동시 방 수 · 같은 방 연속 3시간 (DB check_unit_limits와 같은 계산) ---- */
const unitInfo=u=>(S.units||{})[u]||{daily_min:120,max_rooms:1,people:null};
const hrs=m=>m%60?String(+(m/60).toFixed(1)):String(m/60);
/* 일차 구간별 조당 상한 (day_tiers) — 묶음은 조 수만큼 합산 */
const tiers=()=>S.tiers||[];
function tierMin(day){const t=tiers(),hit=day!=null&&t.find(x=>x.from_day>0&&day>=x.from_day&&day<=x.to_day),def=t.find(x=>x.from_day===0);
  return hit?hit.team_min:def?def.team_min:120}
function tierText(){const t=tiers().slice().sort((a,b)=>(a.from_day||99)-(b.from_day||99));return t.map(x=>`${x.label} ${fmtH(x.team_min)}`).join(" · ")}
function unitCap(u,date){const rs=Object.values(S.rules||{}).filter(r=>(r.unit||r.team)===u);
  const base=tiers().length&&rs.length?rs.reduce((a,r)=>a+tierMin(r.exam_day),0):(unitInfo(u).daily_min??120);
  const b=S.blocks.filter(k=>k.date===date).reduce((a,k)=>a+(Math.min(k.end,CLOSE)-Math.max(k.start,OPEN))*(k.rooms||ROOMS).length,0);
  return Math.floor(base*Math.max(0.5,1-b/(ROOMS.length*(CLOSE-OPEN)))/30)*30}
const unitBookings=(u,date,ex)=>S.bookings.filter(b=>b.id!==ex&&b.date===date&&unitOf(b.team)===u);
/* 식사 시간 할인: 겹치는 부분은 factor만 차감 / 당일 빈자리: 지금부터 walkin_min 안에 시작하면 상한 미포함 */
const meals=()=>S.meals||[];
const chargeMin=(st,en)=>(en-st)-meals().reduce((a,w)=>a+Math.max(0,Math.min(en,w.end_min)-Math.max(st,w.start_min))*(1-Number(w.factor)),0);
const WALK=()=>(S.cfg&&S.cfg.walkin_min!=null)?S.cfg.walkin_min:120;
const isWalk=d=>d.date===ymd()&&d.start<=nowMin()+WALK();
const fmtH=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h&&r?`${h}시간 ${r}분`:h?`${h}시간`:`${r}분`};
const mealText=()=>meals().map(w=>`${fmt(w.start_min)}–${fmt(w.end_min)}`).join(", ");
const mealRate=()=>{const f=Number((meals()[0]||{factor:1}).factor);return f===0?"안 들어가고":f===0.5?"절반만 들어가고":`${Math.round(f*100)}%만 들어가고`};
const unitUsed=(u,date,ex)=>unitBookings(u,date,ex).filter(b=>!b.walkin).reduce((a,b)=>a+chargeMin(b.start,b.end),0);
function unitRun(u,d,room,ex){const l=unitBookings(u,d.date,ex).filter(b=>b.room===room);let s=d.start,e=d.end,f;
  while((f=l.find(b=>b.end===s)))s=f.start;while((f=l.find(b=>b.start===e)))e=f.end;return e-s}
function limitCheck(team,d,room,ex,walk){const u=unitOf(team);
  if(!walk&&unitUsed(u,d.date,ex)+chargeMin(d.start,d.end)>unitCap(u,d.date)+1e-9)return "DAILY_CAP";
  if(unitBookings(u,d.date,ex).filter(b=>overlap(b,d)).length>=(unitInfo(u).max_rooms||1))return "TEAM_BUSY";
  if(unitRun(u,d,room,ex)>MAXLEN)return "RUN_LIMIT";
  return ""}
const unitName=t=>{const u=unitOf(t),ts=Object.values(S.rules||{}).filter(r=>(r.unit||r.team)===u).map(r=>r.team).sort();return ts.length>1?ts.join("·")+"조 합산":t+"조"};
function dateBookable(d){if(isAdmin())return true;return d>=ymd()&&d<=lastBookable()}

/* ================= 오류 문구 ================= */
function errText(e){
  const m=String(e&&(e.message||e.details||e.code)||"");
  if(m.includes("NOT_LEADER")||m.includes("NOT_ADMIN"))return "코드가 맞지 않아요. 다시 로그인해 주세요.";
  if(m.includes("NOT_IN_USE"))return "지금 사용 중인 신청만 조정할 수 있어요.";
  if(m.includes("TOO_SHORT"))return "더 줄일 수 없어요. 이미 지난 시간이거나 시작 시간보다 빨라져요.";
  if(m.includes("CLOSE_TIME"))return "23:00 이후로는 연장할 수 없어요.";
  if(m.includes("TOO_LONG"))return "한 번 사용은 연장 포함 최대 3시간이에요.";
  if(m.includes("DAILY_CAP"))return isLeader()?`${unitName(S.team)} 하루 사용 상한을 넘어요. 식사 시간·당일 빈자리를 쓰거나 다른 날을 골라 주세요.`:"이 조의 하루 사용 상한을 넘어요.";
  if(m.includes("BAD_CFG"))return "설정 값을 확인해 주세요.";
  if(m.includes("RUN_LIMIT"))return "같은 방은 연달아 최대 3시간까지예요. 시간을 띄우거나 다른 방을 골라 주세요.";
  if(m.includes("NOT_YOURS"))return "우리 조 신청만 조정할 수 있어요.";
  if(m.includes("ENDED"))return "이미 끝난 신청은 바꿀 수 없어요.";
  if(m.includes("FIXED_TIME"))return "고정 시간대는 시간·방을 관리자만 바꿀 수 있어요. 재료·연습 내용은 바꿀 수 있어요.";
  if(m.includes("STARTED"))return "이미 시작한 신청은 바꿀 수 없어요. 연장·조기 퇴실을 써 주세요.";
  if(m.includes("FIXED_ONLY_ADMIN"))return "고정 시간대는 관리자만 바꿀 수 있어요.";
  if(m.includes("NOT_FOUND"))return "신청을 찾지 못했어요. 새로고침해 주세요.";
  if(m.includes("BLOCKED"))return "이 방·시간은 관리자가 사용 금지로 정해 뒀어요.";
  if(m.includes("BAD_PERIOD"))return "기간을 확인해 주세요. 끝 날짜가 시작보다 뒤여야 하고, 최대 6개월이에요.";
  if(m.includes("NO_DAYS"))return "요일을 하나 이상 골라 주세요.";
  if(m.includes("NO_ROOMS"))return "사용 금지할 방을 하나 이상 골라 주세요.";
  if(m.includes("BAD_RANGE"))return "시작이 끝보다 빨라야 하고, 07:00–23:00 안이어야 해요.";
  if(m.includes("DAILY_LIMIT"))return "하루 신청 한도를 넘었어요.";
  if(m.includes("TEAM_BUSY"))return isLeader()?`${unitName(S.team)}는 같은 시간에 방 ${unitInfo(unitOf(S.team)).max_rooms||1}개까지 쓸 수 있어요.`:"이 조는 이 시간에 쓸 수 있는 방 수를 다 썼어요.";
  if(m.includes("KIT_TAKEN"))return "방금 다른 조가 같은 재료 세트를 잡았어요. 재료를 다시 골라 주세요.";
  if(m.includes("BAD_DURATION"))return isAdmin()?"관리자 시간 설정이 DB에 아직 반영 안 됐어요. 업데이트 013 SQL을 실행해 주세요.":"사용 시간은 1시간 또는 2시간만 고를 수 있어요.";
  if(m.includes("TOO_FAR"))return `${md(lastBookable())}까지만 신청할 수 있어요. ${isLeader()?`우리 조는 매일 ${openHM(S.team)}에`:"매일 밤 일차 순서대로"} 다음 날이 열려요.`;
  if(m.includes("PAST"))return "이미 지난 시간은 신청할 수 없어요.";

  if(m.includes("BAD_TEAM"))return "없는 조예요. 조 이름을 확인해 주세요.";

    async setKits(id,types,series){const b0=db.bookings.find(b=>b.id===id);const tg=db.bookings.filter(b=>b.id===id||(series&&b0.fixed&&b.fixed===b0.fixed&&b.date>=ymd()));const short=[];
      for(const b of tg){const keep=(b.kits||[]).filter(k=>types.includes(k.split("-")[0]));for(const t of types){if(keep.some(k=>k.split("-")[0]===t))continue;
        const s=SETS.find(s=>!db.bookings.some(o=>o.id!==b.id&&o.date===b.date&&(o.kits||[]).includes(t+"-"+s)&&overlap(o,b)));if(s)keep.push(t+"-"+s);else short.push({date:b.date,kit:t})}b.kits=keep}
      save();S.bookings=db.bookings.slice();return {updated:tg.length,short}},
    subscribe(){}
  };
}

const dayBookings=d=>S.bookings.filter(b=>b.date===d);
function usedSets(d,ex){const u=new Set();S.bookings.filter(b=>b.id!==ex&&b.date===d.date&&overlap(b,d)).forEach(b=>(b.kits||[]).forEach(k=>u.add(k)));return u}
const blockAt=(d,room)=>S.blocks.find(k=>k.date===d.date&&overlap(k,d)&&(room==null||(k.rooms||ROOMS).includes(room)));
const roomsLabel=rs=>!rs||rs.length>=ROOMS.length?"전체 방":rs.join("·")+"번 방";
function inUseNow(b){const nm=nowMin();return b.date===ymd()&&b.start<=nm&&nm<b.end}
/* 조기 퇴실/연장 가능 여부: 안 되면 오류 코드, 되면 "" */
function adjCheck(b,delta,code){
  const ne=b.end+delta,nm=nowMin(),adm=isAdmin();
  const R=(c,t)=>code?c:t;
  if(!adm&&!inUseNow(b))return R("NOT_IN_USE","사용 중 아님");
  if(delta<0){
    if(ne<=b.start)return R("TOO_SHORT","시작 전으로 못 줄여요");
    if(!adm&&b.date===ymd()&&ne<=nm)return R("TOO_SHORT","이미 지난 시간");
    return "";
  }
  const add={date:b.date,start:b.end,end:ne};
  if(ne>CLOSE)return R("CLOSE_TIME","23시 마감");
  if(!adm&&ne-b.start>MAXLEN)return R("TOO_LONG","최대 3시간");
  if(S.bookings.some(o=>o.id!==b.id&&o.date===b.date&&o.room===b.room&&overlap(o,add)))return R("23P01","다음 신청 있음");
  if(!adm){const c=limitCheck(b.team,{date:b.date,start:b.start,end:ne},b.room,b.id,b.walkin||isWalk({date:b.date,start:b.end}));if(c)return R(c,c==="DAILY_CAP"?"하루 상한":c==="TEAM_BUSY"?"동시 방 수 초과":"같은 방 연속 3시간")}
  if((b.kits||[]).length&&S.bookings.some(o=>o.id!==b.id&&o.date===b.date&&(o.kits||[]).some(k=>b.kits.includes(k))&&overlap(o,add)))return R("KIT_TAKEN","재료 겹침");
  if(!adm&&blockAt(add,b.room))return R("BLOCKED","사용 금지 시간");
  if(!adm&&!roomInfo(b.room).open)return R("ROOM_CLOSED","방 사용 불가");
  return "";
}
const roomTaken=(d,room,ex)=>S.bookings.filter(b=>b.id!==ex&&b.date===d.date&&b.room===room&&overlap(b,d));
function kitState(kid){
  const k=S.kits[kid];
  if(k&&k.status==="out")return {cls:"out",text:"대여중",sub:k.who||""};
  const t=ymd(),nm=nowMin(),list=dayBookings(t).filter(b=>(b.kits||[]).includes(kid));
  const cur=list.find(b=>b.start<=nm&&nm<b.end);
  if(cur)return {cls:"held",text:"사용",sub:`${teamLabel(cur)} · ${cur.room}번 방 ~${fmt(cur.end)}`};
  return {cls:"",text:"보관",sub:""};
}

/* ---- 신청 폼 ---- */
/* 기간 반복: 시작~끝 날짜 중 요일이 맞는 날 목록 */
function repeatDates(from,to,days){const out=[];if(!from||!to||to<from)return out;
  for(let d=from;d<=to&&out.length<200;d=addDays(d,1))if(days.includes(parseYmd(d).getDay()))out.push(d);return out}
const PRESETS=[[7,"1주"],[14,"2주"],[28,"4주"],[56,"8주"]];
function openForm(pre={}){
  if(!canAct()){openLogin();return}
  const date=pre.date||S.sel;
  if(!dateBookable(date)){toast(`${md(lastBookable())}까지만 신청할 수 있어요`);return}
  S.draft={team:isAdmin()?(store("osce-admin-team")||""):S.team,day:pre.day??store("osce-day")??"",date,room:pre.room||1,start:pre.start||"09:00",dur:DURS.includes(pre.dur)?pre.dur:120,content:pre.content||"",kits:new Set()};
  if(isLeader()){const u=unitOf(S.team),left=unitCap(u,date)-unitUsed(u,date),st=toMin(S.draft.start);
    if(!isWalk({date,start:st})&&left<chargeMin(st,st+S.draft.dur))S.draft.dur=60}
  if(isAdmin()){S.draft.rooms=new Set([S.draft.room]);S.draft.rep={on:false,to:addDays(date,6),daily:true,days:new Set([1,2,3,4,5])}}
  openDrawer(isAdmin()?"대리 신청 (관리자)":"연습 신청",{form:true});drawForm();
}
/* 신청 변경: 신청 폼을 기존 내용으로 채워서 엶 */
function canEdit(b){if(!b)return false;if(isAdmin())return true;
  return isLeader()&&b.team===S.team&&(b.date>ymd()||(b.date===ymd()&&b.end>nowMin()))}
/* 조장: 사용 중이거나 고정 시간대인 신청은 시간·방을 못 바꾸고 재료·내용만 */
function editLocked(d){if(!d||!d.editId||isAdmin())return false;const o=d.orig;return !!o.fixed||(o.date===ymd()&&o.start<=nowMin())}
function openEdit(id){
  const b=S.bookings.find(x=>x.id===id);if(!canEdit(b))return;
  S.draft={editId:id,orig:b,team:b.team,day:b.day||"",date:b.date,room:b.room,start:fmt(b.start),dur:b.end-b.start,content:b.content||"",
    kits:new Set((b.kits||[]).map(k=>k.split("-")[0]))};
  openDrawer("신청 변경",{form:true,edit:id});drawForm();
}
const draftRange=()=>{const d=S.draft,s=toMin(d.start);return {date:d.date,start:s,end:s+d.dur,room:d.room}};
function drawForm(){
  const d=S.draft,r=draftRange(),ex=d.editId,adm=isAdmin(),durs=adm?[60,120,180]:ex&&!DURS.includes(d.orig.end-d.orig.start)?[...DURS,d.orig.end-d.orig.start]:DURS;

  const blockedRooms=new Set(isAdmin()?[]:ROOMS.filter(x=>blockAt(r,x)));
  const taken=new Set(ROOMS.filter(x=>roomTaken(r,x,ex).length||closedRooms.has(x)||blockedRooms.has(x)));
  const used=usedSets(r,ex),clash=roomTaken(r,d.room,ex),freeAlt=ROOMS.filter(x=>!taken.has(x));
  const lock=editLocked(d);
  const moved=!ex||r.date!==d.orig.date||d.room!==d.orig.room||r.start!==d.orig.start||r.end!==d.orig.end;
  const u=d.team?unitOf(d.team):"",uCap=u?unitCap(u,r.date):0,uUsed=u?unitUsed(u,r.date,ex):0,uMax=u?(unitInfo(u).max_rooms||1):1;
  const uSame=u?unitBookings(u,r.date,ex).filter(b=>overlap(b,r)):[];

function setMsg(t,c){const m=$("fMsg");if(m){m.textContent=t;m.className="msg "+(c||"")}}
async function submit(){
  if(S.busy)return;
  readForm();const d=S.draft,r=draftRange();
  if(isAdmin()&&!d.editId&&d.rooms)return submitMulti();
  if(isAdmin()&&!d.team){setMsg("어느 조로 신청할지 적어 주세요.","err");$("fTeam").focus();return}
  const lock=editLocked(d);
  if(!isAdmin()&&!lock&&blockAt(r,S.draft.room)){setMsg(errText(new Error("BLOCKED")),"err");return}
  const ex=d.editId;
  if(isLeader()&&!lock&&(!ex||r.date!==d.orig.date||d.room!==d.orig.room||r.start!==d.orig.start||r.end!==d.orig.end)){const c=limitCheck(S.team,r,d.room,ex,isWalk(r));if(c){setMsg(errText(new Error(c)),"err");return}}
  if(!lock&&!dateBookable(r.date)){setMsg(errText(new Error(r.date<ymd()?"PAST":"TOO_FAR")),"err");return}
  if(!isAdmin()&&!lock&&r.date===ymd()&&r.end<=nowMin()){setMsg("이미 지난 시간은 신청할 수 없어요.","err");return}
  if(r.start<OPEN||r.end>CLOSE){setMsg("07:00–23:00 사이로만 신청할 수 있어요.","err");return}
  if(roomTaken(r,d.room,ex).length||(!roomInfo(d.room).open&&!(ex&&d.room===d.orig.room))){drawForm();return}
  const used=usedSets(r,ex),kits=[];
  for(const k of d.kits){const keep=ex&&(d.orig.kits||[]).find(x=>x.split("-")[0]===k&&!used.has(x));if(keep){kits.push(keep);continue}
    const s=SETS.find(s=>!used.has(k+"-"+s));if(!s){setMsg(KITNAME[k]+"는 이 시간대에 남는 세트가 없어요.","err");return}kits.push(k+"-"+s)}
  $("fSubmit").disabled=true;S.busy=true;
  try{
    const v={date:r.date,room:d.room,start:r.start,end:r.end,day:d.day,content:d.content,kits,team:isAdmin()?d.team:null};
    const b=ex?await api.update(ex,v):await api.add(v);
    if(!ex){store("osce-day",d.day);if(isAdmin())store("osce-admin-team",d.team)}
    putLocal(b);S.sel=r.date;render();syncSoon();
    openDetail(b.id,!ex);if(ex)toast("신청 내용을 바꿨어요");
  }catch(err){setMsg(errText(err),"err");$("fSubmit").disabled=false;try{await api.loadBookings();render()}catch(e){}}
  finally{S.busy=false}
}
/* 관리자: 기간 반복 대리 신청 — 날짜마다·방마다 한 건씩, 겹치면 건너뜀 */
async function submitRepeat(){
  const d=S.draft,r=draftRange(),rooms=[...d.rooms].sort((a,b)=>a-b),rp=d.rep;
  const dates=repeatDates(d.date,rp.to,rp.daily?[0,1,2,3,4,5,6]:[...rp.days]);
  if(!d.team){setMsg("어느 조로 신청할지 적어 주세요.","err");$("fTeam").focus();return}
  if(!rooms.length){setMsg("방을 하나 이상 골라 주세요.","err");return}
  if(!dates.length){setMsg("반복할 날짜가 없어요. 끝 날짜와 요일을 확인해 주세요.","err");return}
  if(r.start<OPEN||r.end>CLOSE){setMsg("07:00–23:00 사이로만 신청할 수 있어요.","err");return}
  S.busy=true;$("fSubmit").disabled=true;
  const ok=[],skip=[],short=[];let i=0;
  for(const date of dates){
    const rr={date,start:r.start,end:r.end},used=usedSets(rr);
    for(const room of rooms){
      i++;if(i%5===0)setMsg(`넣는 중… ${i}/${dates.length*rooms.length}`,"");
      if(!roomInfo(room).open){skip.push(`${md(date)} ${room}번: 사용 불가 방`);continue}
      const hit=roomTaken(rr,room);if(hit.length){skip.push(`${md(date)} ${room}번: ${hit[0].team}조 신청과 겹침`);continue}
      const kits=[];
      for(const k of d.kits){const s=SETS.find(s=>!used.has(k+"-"+s));if(s){kits.push(k+"-"+s);used.add(k+"-"+s)}else short.push(`${md(date)} ${room}번 ${KITSHORT[k]}`)}
      try{const b=await api.add({date,room,start:r.start,end:r.end,day:d.day,content:d.content,kits,team:d.team});putLocal(b);ok.push(b)}
      catch(err){kits.forEach(k=>used.delete(k));skip.push(`${md(date)} ${room}번: ${errText(err)}`)}
    }
  }
  S.busy=false;store("osce-day",d.day);store("osce-admin-team",d.team);
  render();syncSoon();
  d.added=[...(d.added||[]),...ok.map(b=>b.id)].slice(-30);rp.on=false;drawForm();
  const parts=[`${d.team}조 ${md(dates[0])}~${md(dates[dates.length-1])} ${fmt(r.start)}–${fmt(r.end)} · ${ok.length}건 신청했어요.`];
  if(skip.length)parts.push(`건너뜀 ${skip.length}건 — ${skip.slice(0,6).join(" / ")}${skip.length>6?" …":""}`);
  if(short.length)parts.push(`재료 세트 모자람 ${short.length}건`);
  setMsg(parts.join(" "),skip.length||!ok.length?"err":"good");
}
/* 관리자: 고른 방마다 한 건씩 신청, 창은 열어 둔 채 이어서 추가 */
async function submitMulti(){
  const d=S.draft,r=draftRange(),rooms=[...d.rooms].sort((a,b)=>a-b);
  if(d.rep&&d.rep.on)return submitRepeat();
  if(!d.team){setMsg("어느 조로 신청할지 적어 주세요.","err");$("fTeam").focus();return}
  if(!rooms.length){setMsg("방을 하나 이상 골라 주세요.","err");return}
  if(r.start<OPEN||r.end>CLOSE){setMsg("07:00–23:00 사이로만 신청할 수 있어요.","err");return}
  if(rooms.some(x=>roomTaken(r,x).length||!roomInfo(x).open)){drawForm();return}
  S.busy=true;$("fSubmit").disabled=true;
  const used=usedSets(r),ok=[],fail=[],short=[];
  for(const room of rooms){
    const kits=[];
    for(const k of d.kits){const s=SETS.find(s=>!used.has(k+"-"+s));if(s){kits.push(k+"-"+s);used.add(k+"-"+s)}else short.push(room+"번 "+KITSHORT[k])}
    try{const b=await api.add({date:r.date,room,start:r.start,end:r.end,day:d.day,content:d.content,kits,team:d.team});putLocal(b);ok.push(b)}
    catch(err){kits.forEach(k=>used.delete(k));fail.push(room+"번: "+errText(err))}
  }
  S.busy=false;
  store("osce-day",d.day);store("osce-admin-team",d.team);
  S.sel=r.date;render();syncSoon();
  d.added=[...(d.added||[]),...ok.map(b=>b.id)];
  if(ok.length){d.kits=new Set();
    const free=ROOMS.filter(x=>roomInfo(x).open&&!roomTaken(r,x).length),last=Math.max(...ok.map(b=>b.room));
    d.rooms=new Set(free.length?[free.find(x=>x>last)||free[0]]:[]);d.room=[...d.rooms][0]||d.room}
  drawForm();
  const parts=[];
  if(ok.length)parts.push(`${d.team}조 ${ok.map(b=>b.room).join("·")}번 방 ${fmt(r.start)}–${fmt(r.end)} 넣었어요.`);
  if(short.length)parts.push(`재료 세트 모자람: ${short.join(", ")}`);
  if(fail.length)parts.push(`못 넣은 방 — ${fail.join(" / ")}`);
  if(ok.length&&!fail.length)parts.push("조·시간·방 바꿔서 바로 추가하세요.");
  setMsg(parts.join(" "),fail.length||!ok.length?"err":"good");
}

  const c=$("cancelBtn");
  if(c)c.onclick=()=>{
    $("cancelZone").innerHTML=`<div class="alert"><div>${esc(teamLabel(b))} 신청을 취소할까요? 시간표에서 바로 사라져요.</div><div style="display:flex;gap:6px"><button class="btn sm primary" type="button" id="cYes">취소하기</button><button class="btn sm ghost" type="button" id="cNo">그대로 두기</button></div></div>`;
    $("cNo").onclick=()=>openDetail(id);
    $("cYes").onclick=async()=>{try{await api.cancel(id);dropLocal(id);render();closeDrawer();toast("신청을 취소했어요");syncSoon()}catch(err){toast(err.message.includes("우리 조")?err.message:errText(err))}};
  };
}

/* 다른 사람이 바꾼 내용이 들어오면 열려 있는 창도 맞춰 줌 (입력 중엔 건드리지 않음) */
function redrawDrawer(){
  const v=S.view;if(!v||!$("drawer").classList.contains("on"))return;
  const typing=document.activeElement&&$("drawer").contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(v.detail){const b=S.bookings.find(x=>x.id===v.detail);
    if(!b){closeDrawer();toast("이 신청은 취소됐어요");return}
    if(!typing&&JSON.stringify(b)!==v.sig&&!$("cYes"))openDetail(v.detail)}
  else if(v.form&&S.draft&&!typing&&!S.busy){
    if(v.edit&&!S.bookings.some(x=>x.id===v.edit)){closeDrawer();toast("이 신청은 취소됐어요");return}
    const m0=$("fMsg"),msg=m0&&m0.textContent,cls=m0&&m0.className.replace("msg","").trim();readForm();drawForm();if(msg)setMsg(msg,cls)}
}

/* ================= 카톡 양식 파서 ================= */
function parseKakao(s){
  s=(s||"").trim();if(!s)return {};
  const r={};let m;
  if(m=s.match(/(\d+)\s*일차/))r.day=m[1]+"일차";
  if(m=s.match(/([A-Za-z0-9가-힣])\s*[팀조]/))r.team=m[1].toUpperCase();
  if(m=s.match(/(\d{1,2})\s*[\/.월]\s*(\d{1,2})/))r.date=new Date().getFullYear()+"-"+pad(m[1])+"-"+pad(m[2]);
  const tm=s.match(/(오전|오후)?\s*(\d{1,2})\s*(?:시\s*(반|(\d{1,2})\s*분)?|:(\d{2}))(?:\s*[-~]\s*(오전|오후)?\s*(\d{1,2})\s*(?:시|:(\d{2})))?/);
  if(tm){let h=Number(tm[2]);const mi=tm[3]==="반"?30:Number(tm[4]||tm[5]||0);
    if(tm[1]==="오후"&&h<12)h+=12;if(!tm[1]&&h>=1&&h<=7)h+=12;r.start=pad(h)+":"+pad(mi);
    if(tm[7]){let h2=Number(tm[7]);if(tm[6]==="오후"&&h2<12)h2+=12;else if(h2<h&&h2+12>h)h2+=12;
      const dur=h2*60+Number(tm[8]||0)-(h*60+mi);if(DURS.includes(dur))r.dur=dur}}
  if(m=s.match(/(\d)\s*번\s*방?/)||s.match(/방\s*(\d)/)){const n=Number(m[1]);if(n>=1&&n<=6)r.room=n}
  if(tm){let rest=s.slice(s.indexOf(tm[0])+tm[0].length);
    rest=rest.replace(/오스키실|osce실/gi,"").replace(/\d\s*번\s*방?|방\s*\d/,"").trim();if(rest)r.content=rest}
  return r;
}
window.__parseKakao=parseKakao;

/* ================= 상단 이벤트 ================= */
function go(d){S.sel=d;render()}
$("prev").onclick=()=>go(addDays(S.sel,-1));
$("next").onclick=()=>go(addDays(S.sel,1));
$("todayBtn").onclick=()=>go(ymd());
$("datePick").onchange=e=>{if(e.target.value)go(e.target.value)};
$("week").onclick=e=>{const b=e.target.closest("[data-date]");if(b)go(b.dataset.date)};
$("loginInline").onclick=openLogin;
$("notices").addEventListener("click",e=>{const b=e.target.closest("[data-adjopen]");if(b)openDetail(b.dataset.adjopen)});
function syncThemeBtn(){const dark=document.documentElement.getAttribute("data-theme")==="dark";$("themeBtn").textContent=dark?"☀":"☾";$("themeBtn").setAttribute("aria-label",dark?"밝은 모드로 바꾸기":"다크 모드로 바꾸기")}
$("themeBtn").onclick=()=>{const next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);store("osce-theme",next);syncThemeBtn()};

function syncTeams(){window.OSCETeams.set([...(S.teamList||[]),...S.bookings.map(b=>b.team)])}
function render(){syncTeams();renderAuth();renderNotices();renderTop();renderGrid();renderKits()}

/* ================= 시작 ================= */
(async function boot(){
  if(!document.documentElement.getAttribute("data-theme"))document.documentElement.setAttribute("data-theme",store("osce-theme")||"light");
  syncThemeBtn();
  S.code=store("osce-code")||"";S.role=store("osce-role")||(store("osce-team")?"leader":"");S.team=store("osce-team")||"";
  if(!LIVE)$("demo").hidden=false;
  render();
  try{
    if(S.code){const info=await api.login(S.code);setAuth(info?S.code:"",info)}
    await Promise.all([api.loadBookings(),api.loadKits(),api.loadMeta()]);
  }catch(e){toast("데이터를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.")}
  render();
  const g=document.querySelector(".grid"),target=(Math.min(Math.max(nowMin(),OPEN),CLOSE)-OPEN)/60*hourPx()-hourPx();
  if(g&&target>240)window.scrollTo({top:g.getBoundingClientRect().top+window.scrollY+target-140,behavior:"auto"});
  api.subscribe();
  setInterval(()=>{renderAuth();renderNotices();renderTop();renderKits();if(S.sel===ymd())renderGrid()},60000);
})();
})();
</script>

<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오스키실 현황판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){var t="light";try{t=localStorage.getItem("osce-theme")||"light"}catch(e){}document.documentElement.setAttribute("data-theme",t)})();
</script>
<style>
/* Layout: 보기 전용 현황판. 상단(탭·시계) → 4주 날짜 띠 → 방 6칸(같은 크기) → 방별 가로 타임라인 → 재료 20세트. 모바일은 방 3×2, 타임라인·재료를 압축해 한 화면 위주로 */
:root{
  color-scheme:light;
  --bg:#f5f8fa; --surface:#ffffff; --sunk:#f0f4f7; --line:#e6ecf0; --line-strong:#d2dbe1;
  --fg:#16212a; --muted:#64737f; --faint:#a3b0ba;
  --accent:#0fa394; --accent-ink:#0b7f74; --accent-soft:#e2f6f3; --on-accent:#ffffff;
  --out:#e04f3a; --out-soft:#fdebe7; --held:#d48a0b; --held-soft:#fdf3dd; --ok:#22a05a; --ok-soft:#e3f6ea;
  --shadow:0 1px 2px rgba(22,40,55,.04),0 6px 20px rgba(22,40,55,.06);
  --p0:#e3f1ff; --p0i:#1f5f9e; --p1:#ffe9e3; --p1i:#a1442d; --p2:#e5f7e8; --p2i:#2b7a3e; --p3:#f3e8ff; --p3i:#6b3fa0;
  --p4:#fff4d6; --p4i:#8a6200; --p5:#e0f6f6; --p5i:#1d7272; --p6:#ffe6f1; --p6i:#a3326a; --p7:#ebeefe; --p7i:#3d4fa8;
  --t-sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --t-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --room-h:166px; --track-h:44px; --label-w:56px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1316; --surface:#151c20; --sunk:#1b2328; --line:#232d33; --line-strong:#34414a;
  --fg:#e8eef2; --muted:#93a2ad; --faint:#5f6e78;
  --accent:#3cc7b8; --accent-ink:#7be0d4; --accent-soft:#143532; --on-accent:#05211e;
  --out:#f08b77; --out-soft:#3b201b; --held:#e8b25a; --held-soft:#352a12; --ok:#6fd096; --ok-soft:#173523;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --p0:#17304a; --p0i:#9cc8f2; --p1:#3d241d; --p1i:#f2b19f; --p2:#183522; --p2i:#9fdcae; --p3:#2c2140; --p3i:#cfb2f2;
  --p4:#3a2f10; --p4i:#ecd08a; --p5:#143535; --p5i:#93dcdc; --p6:#3c1d2c; --p6i:#f2a8cb; --p7:#20264a; --p7i:#b2bdf5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--t-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--t-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.lead{display:flex;align-items:center;gap:12px;min-width:0}
.tabs{display:inline-flex;gap:2px;background:var(--sunk);padding:3px;border-radius:10px;flex:none}
.tabs a{padding:5px 12px;border-radius:8px;font-size:.84rem;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs a:not([aria-current]):hover{color:var(--accent-ink)}
h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.right{display:flex;align-items:center;gap:8px}
.clock{font-family:var(--t-mono);font-size:1.7rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.live.on{color:var(--ok)} .live.on i{background:var(--ok);animation:pulse 2s infinite}
.live.off{color:var(--out)} .live.off i{background:var(--out)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.iconbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);flex:none}
.demo{font-size:.84rem;background:var(--held-soft);border-radius:10px;padding:9px 12px}

/* date strip */
.days{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:thin}
.day{flex:0 0 58px;scroll-snap-align:start;border-radius:12px;padding:7px 2px 6px;display:grid;justify-items:center;gap:1px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.day:hover{border-color:var(--line-strong)}
.day .w{font-size:.7rem;font-weight:600}
.day .n{font-family:var(--t-mono);font-weight:600;font-size:1.02rem;color:var(--fg);line-height:1.2}
.day .c{font-size:.64rem;font-weight:700;color:var(--accent-ink);min-height:1.1em}
.day.sat .w{color:#3b6fd6} .day.sun .w{color:var(--out)}
.day.mon1{margin-left:6px}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] .n,.day[aria-pressed="true"] .c,.day[aria-pressed="true"] .w{color:var(--on-accent)}
.selline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.selline h2{margin:0}
h2{margin:0 0 10px;font-size:1rem;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font-weight:500;color:var(--muted);font-size:.8rem}

/* rooms: 모든 칸 같은 크기 */
.rooms{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:var(--room-h);gap:10px}
@media (max-width:1100px){.rooms{grid-template-columns:repeat(3,minmax(0,1fr))}}
.room{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.room .rh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.room .rn{font-weight:700;font-size:1rem}
.badge{font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.badge.use{background:var(--out-soft);color:var(--out)}
.badge.free{background:var(--ok-soft);color:var(--ok)}
.badge.soon{background:var(--held-soft);color:var(--held)}
.badge.cnt{background:var(--sunk);color:var(--muted)}
.room.busy{background:var(--pb);border-color:transparent}
.room.busy .main,.room.busy .sub{color:var(--pi)}
.main{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main.free{color:var(--ok);font-size:1rem}
.sub{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .mono{font-size:.78rem}
.bar{height:4px;border-radius:99px;background:color-mix(in srgb,var(--pi,var(--line)) 18%,transparent);overflow:hidden;margin-top:auto}
.bar span{display:block;height:100%;background:var(--pi,var(--accent));border-radius:99px}
.foot-line{margin-top:auto;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot-line b{color:var(--fg);font-weight:600}
.room.busy .foot-line,.room.busy .foot-line b{color:var(--pi)}
.slots{display:grid;gap:1px;font-size:.8rem;margin-top:2px}
.slots div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot-line.m-more{display:none}
.att{display:flex;gap:3px;flex-wrap:wrap;overflow:hidden;margin-top:4px;min-width:0;max-height:2.6em;align-content:flex-start}
.bar+.att,.bar+.foot-line+.att{margin-top:5px}
.chipx{flex:none;font-size:.66rem;font-weight:700;border-radius:5px;padding:0 5px;line-height:1.55;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chipx.th-on{background:var(--ok-soft);color:var(--ok)}
.chipx.th-off{color:var(--faint);text-decoration:line-through}
.room.busy .chipx.kt{background:color-mix(in srgb,var(--surface) 65%,transparent);color:var(--pi)}
.room.closed{background:repeating-linear-gradient(135deg,var(--surface) 0 8px,var(--sunk) 8px 9px)}
.badge.closed{background:var(--out-soft);color:var(--out)}
.main.closed{color:var(--out);font-size:1rem}
.notices{display:grid;gap:8px}
.ntc{display:flex;align-items:flex-start;gap:10px;border-radius:10px;padding:9px 12px;font-size:.86rem;background:var(--surface);border:1px solid var(--line)}
.ntc .tag{flex:none;font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 8px;margin-top:2px}
.ntc.rule .tag{background:var(--accent-soft);color:var(--accent-ink)}
.ntc.admin{background:var(--held-soft);border-color:transparent}
.ntc.admin .tag{background:var(--held);color:#fff}
.ntc .body{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}

/* timeline */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.tl-scroll{overflow-x:auto}
.tl{display:grid;grid-template-columns:var(--label-w) minmax(0,1fr);min-width:720px;padding:4px 14px 12px 0}
.tl .hd{height:24px;position:relative}
.tl .hd span{position:absolute;top:6px;transform:translateX(-50%);font-family:var(--t-mono);font-size:.68rem;color:var(--faint)}
.tl .rl{display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-weight:700;font-size:.84rem;height:var(--track-h)}
.track{position:relative;height:var(--track-h);border-top:1px solid var(--line);background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(100% / 14))}
.track.last{border-bottom:1px solid var(--line)}
.blk{position:absolute;top:4px;bottom:4px;border-radius:7px;background:var(--pb);color:var(--pi);padding:2px 7px;font-size:.74rem;line-height:1.2;overflow:hidden;white-space:nowrap;display:grid;align-content:center}
.blk b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.blk .t{font-family:var(--t-mono);font-size:.64rem;opacity:.8;overflow:hidden}
.blk.past{opacity:.4}
.nowline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--out);z-index:2;pointer-events:none}

/* kits */
.kits{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:1000px){.kits{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;display:grid;gap:4px;min-width:0}
.kit .kn{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ks{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:center;font-size:.76rem;min-width:0}
.s{display:inline-flex;align-items:center;gap:4px;font-weight:700;border-radius:99px;padding:1px 8px 1px 6px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.s i{width:6px;height:6px;border-radius:50%;background:currentColor}
.s.held{background:var(--held-soft);color:var(--held)}
.s.out{background:var(--out-soft);color:var(--out)}
.ks .w{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{font-size:.78rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.link{font-size:.84rem;color:var(--accent-ink);font-weight:600;text-decoration:none}

/* ---------- 모바일: 한 화면 위주로 압축 ---------- */
@media (max-width:600px){
  :root{--room-h:116px;--track-h:30px;--label-w:30px}
  body{font-size:14px}
  .wrap{gap:12px;padding-block:12px 32px}
  h1{display:none}
  .clock{font-size:1.25rem}
  .live{padding:3px 8px;font-size:.7rem}
  .live #liveText{display:none}
  .iconbtn{width:30px;height:30px}
  .day{flex-basis:48px;padding:5px 2px 4px;border-radius:10px}
  .day .n{font-size:.92rem}
  h2{margin-bottom:6px;font-size:.92rem}
  .rooms{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .room{padding:7px 8px;border-radius:11px;gap:1px}
  .room .rn{font-size:.84rem}
  .badge{font-size:.62rem;padding:0 6px}
  .main{font-size:.92rem}
  .main.free{font-size:.84rem}
  .sub{font-size:.72rem}
  .hide-m,.foot-line{display:none}
  .foot-line.m-more{display:block;margin-top:0;font-size:.66rem}
  .slots{font-size:.72rem}
  .slots .more{display:none}
  .chipx{font-size:.58rem;padding:0 4px}
  .ntc{font-size:.78rem;padding:7px 10px;gap:8px}
  .att{margin-top:auto}
  .bar{height:3px}
  .tl{min-width:0;padding:2px 8px 8px 0}
  .tl .hd span{font-size:.6rem}
  .tl .hd span.odd{display:none}
  .tl .rl{font-size:.74rem;padding-right:6px}
  .blk{padding:1px 4px;font-size:.66rem;border-radius:5px;top:3px;bottom:3px}
  .blk .t,.blk .dl{display:none}
  .kits{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .kit{padding:6px 8px;gap:3px;border-radius:9px}
  .kit .kn{font-size:.8rem}
  .ks{display:block}
  .ks .w{display:none}
  .s{padding:0 6px 0 5px;font-size:.66rem}
  .kit .sets{display:flex;gap:3px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="lead">
      <nav class="tabs" aria-label="페이지"><a href="index.html">예약</a><a href="view.html" aria-current="page">현황판</a></nav>
      <h1>오스키실 현황판</h1>
    </div>
    <div class="right">
      <span class="live" id="live" title="연결 상태"><i></i><span id="liveText">연결 중</span></span>
      <span class="clock" id="clock">--:--</span>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="다크 모드로 바꾸기">☾</button>
    </div>
  </header>

  <div class="demo" id="demo" hidden>미리보기 모드예요. 지금 보이는 신청은 예시예요. config.js에 Supabase 정보가 들어가면 실제 예약이 실시간으로 보여요.</div>
  <div class="notices" id="notices"></div>

  <nav class="days" id="days" aria-label="날짜 선택 (4주)"></nav>

  <section aria-labelledby="nowH">
    <h2 id="nowH"><span id="nowTitle"></span> <small id="nowSub"></small></h2>
    <div class="rooms" id="rooms"></div>
  </section>

  <section aria-labelledby="tlH">
    <h2 id="tlH"><span id="tlTitle">시간표</span> <small id="tlSub"></small></h2>
    <div class="card"><div class="tl-scroll" id="tl"></div></div>
  </section>

  <section aria-labelledby="kH">
    <h2 id="kH">재료 현황 <small>지금 기준</small></h2>
    <div class="kits" id="kits"></div>
  </section>

  <footer class="foot">
    <span id="updated">불러오는 중</span>
    <a class="link" href="index.html">신청하기 (조장) →</a>
  </footer>
</div>

<script>
(function(){
"use strict";
const ROOMS=[1,2,3,4,5,6];
const KITS=[["anes","마취 세트"],["ext","발치"],["sut","봉합"],["tbi","TBI"],["fl","불소도포"],["seal","실란트"],["rd","러버댐"],["srp","SRP"],["ept","EPT"],["probe","치주낭 측정"]];
const SETS=[1,2];
const OPEN=8*60,CLOSE=22*60;
const SPAN_DAYS=28;
const WD=["일","월","화","수","목","금","토"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const toDate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const x=toDate(s);x.setDate(x.getDate()+n);return ymd(x)};
const fmt=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const teamLabel=b=>[b.day,b.team?b.team+"조":""].filter(Boolean).join(" ");
const palette=t=>{let h=0;for(const c of String(t))h=(h*31+c.charCodeAt(0))>>>0;const i=/^[A-Z]$/.test(t)?(t.charCodeAt(0)-65)%8:h%8;return `--pb:var(--p${i});--pi:var(--p${i}i)`};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

const S={bookings:[],kits:{},rooms:{},notice:"",sel:ymd(),lastSync:null};
const roomInfo=r=>S.rooms[r]||{thomas:true,open:true,memo:""};
const KITSHORT={anes:"마취",ext:"발치",sut:"봉합",tbi:"TBI",fl:"불소",seal:"실란트",rd:"러버댐",srp:"SRP",ept:"EPT",probe:"치주낭"};
const kitShort=k=>{const [id,n]=k.split("-");return (KITSHORT[id]||id)+n};
function lastBookable(){const n=new Date();return addDays(ymd(n),2+(n.getHours()>=22?1:0))}
const md=s=>{const d=toDate(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const isToday=()=>S.sel===ymd();

/* ---------- data ---------- */
const cfg=window.OSCE_CONFIG||{};
const LIVE=!!(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&window.supabase);
const rowToBooking=r=>({id:r.id,date:r.date,room:r.room,start:r.start_min,end:r.end_min,day:r.day_label||"",team:r.team,content:r.content||"",kits:r.kits||[]});
let load,subscribe;
if(LIVE){
  const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  load=async()=>{
    const [b,k,rm,st]=await Promise.all([
      sb.from("bookings").select("*").gte("date",ymd()).lte("date",addDays(ymd(),SPAN_DAYS-1)).order("start_min").limit(5000),
      sb.from("kits").select("*"),
      sb.from("rooms").select("*"),
      sb.from("settings").select("*").eq("key","notice")
    ]);
    if(b.error||k.error)throw (b.error||k.error);
    if(!rm.error)S.rooms=Object.fromEntries(rm.data.map(x=>[x.room,x]));
    if(!st.error)S.notice=(st.data[0]&&st.data[0].value)||"";
    S.bookings=b.data.map(rowToBooking);S.kits=Object.fromEntries(k.data.map(r=>[r.id,r]));S.lastSync=new Date();
  };
  subscribe=()=>{
    let t;const refresh=()=>{clearTimeout(t);t=setTimeout(()=>load().then(render).catch(()=>setLive("off")),150)};
    sb.channel("osce-view")
      .on("postgres_changes",{event:"*",schema:"public",table:"bookings"},refresh)
      .on("postgres_changes",{event:"*",schema:"public",table:"kits"},refresh)
      .on("postgres_changes",{event:"*",schema:"public",table:"rooms"},refresh)
      .on("postgres_changes",{event:"*",schema:"public",table:"settings"},refresh)
      .subscribe(st=>{if(st==="SUBSCRIBED")setLive("on");else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED")setLive("off")});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
    setInterval(refresh,5*60*1000);
  };
}else{
  load=async()=>{const t=ymd(),n=nowMin(),r30=m=>Math.max(OPEN,Math.min(CLOSE-120,Math.floor(m/30)*30));
    const a=r30(n-30),bk=(id,date,room,s,dur,day,team,content,kits)=>({id,date,room,start:s,end:s+dur,day,team,content,kits});
    S.bookings=[
      bk("e1",t,1,a,120,"3일차","C","A형 모의고사",["anes-1","ext-1"]),
      bk("e2",t,2,r30(n-60),60,"3일차","A","봉합·발치 반복",["sut-1"]),
      bk("e3",t,2,r30(n+60),120,"3일차","F","SRP·치주낭 측정",["srp-1","probe-1"]),
      bk("e4",t,4,r30(n+30),60,"4일차","B","러버댐·실란트",["rd-1","seal-1"]),
      bk("e5",t,5,r30(n-30),120,"4일차","D","B형 모의고사",["anes-2","ept-1"]),
      bk("e6",t,6,OPEN,120,"3일차","H","TBI 실습",["tbi-1"]),
      bk("e7",addDays(t,1),3,540,120,"4일차","E","TBI·불소도포",["tbi-1","fl-1"]),
      bk("e8",addDays(t,1),1,600,60,"4일차","C","실란트",["seal-1"]),
      bk("e9",addDays(t,3),2,780,120,"5일차","G","A형 모의고사",["anes-1"]),
      bk("e10",addDays(t,3),5,840,60,"5일차","B","EPT",["ept-1"]),
      bk("e11",addDays(t,6),4,540,120,"6일차","A","발치·봉합",["ext-1","sut-1"])
    ];
    S.kits={"sut-2":{status:"out",who:"G조"}};
    S.rooms={3:{thomas:false,open:true,memo:""},6:{thomas:false,open:false,memo:"오후 점검"}};
    S.notice="10/20(월) 오후에는 1–3번 방을 교수님 실습으로 사용합니다.";S.lastSync=new Date()};
  subscribe=()=>setLive("demo");
}
function setLive(st){$("live").className="live "+(st==="on"?"on":st==="off"?"off":"");
  $("liveText").textContent=st==="on"?"실시간":st==="off"?"연결 끊김 · 재시도 중":st==="demo"?"미리보기":"연결 중"}

/* ---------- render ---------- */
function renderHead(){
  const n=new Date();$("clock").textContent=pad(n.getHours())+":"+pad(n.getMinutes());
  $("updated").textContent=S.lastSync?`마지막 갱신 ${pad(S.lastSync.getHours())}:${pad(S.lastSync.getMinutes())}:${pad(S.lastSync.getSeconds())} · 신청이 바뀌면 자동으로 새로 고쳐져요`:"불러오는 중";
}
function renderDays(){
  const t=ymd();let h="";
  for(let i=0;i<SPAN_DAYS;i++){
    const s=addDays(t,i),x=toDate(s),n=S.bookings.filter(b=>b.date===s).length,wd=x.getDay();
    h+=`<button type="button" class="day ${wd===6?"sat":""} ${wd===0?"sun":""} ${wd===1&&i>0?"mon1":""}" data-date="${s}" aria-pressed="${s===S.sel}" aria-label="${x.getMonth()+1}월 ${x.getDate()}일 ${WD[wd]}요일, 신청 ${n}건">
      <span class="w">${i===0?"오늘":WD[wd]}</span><span class="n">${x.getMonth()+1===toDate(t).getMonth()+1||x.getDate()!==1?x.getDate():(x.getMonth()+1)+"/"+x.getDate()}</span><span class="c">${n?n+"건":""}</span></button>`;
  }
  $("days").innerHTML=h;
}
function dayTitle(){const x=toDate(S.sel),off=Math.round((x-toDate(ymd()))/864e5);
  return `${x.getMonth()+1}월 ${x.getDate()}일 (${WD[x.getDay()]})`+(off===0?" · 오늘":off===1?" · 내일":"")}
function renderNotices(){
  const late=new Date().getHours()>=22;
  let h=`<div class="ntc rule"><span class="tag">예약 안내</span><div class="body">예약은 오늘부터 2일 후까지 · 지금은 <b>${md(lastBookable())}까지</b> 신청 가능 · 매일 밤 10시에 다음 날짜가 열려요${late?"":`<span class="hide-m"> (오늘 밤 10시 ${md(addDays(lastBookable(),1))} 오픈)</span>`}</div></div>`;
  if(S.notice.trim())h=`<div class="ntc admin"><span class="tag">공지</span><div class="body">${esc(S.notice.trim())}</div></div>`+h;
  $("notices").innerHTML=h;
}
function att(r,kits){const ri=roomInfo(r);
  return `<div class="att"><span class="chipx ${ri.thomas?"th-on":"th-off"}" title="토마스 ${ri.thomas?"있음":"없음"}">토마스</span>${(kits||[]).map(k=>`<span class="chipx kt">${esc(kitShort(k))}</span>`).join("")}</div>`}
function renderRooms(){
  const today=isToday(),list=S.bookings.filter(b=>b.date===S.sel),nm=today?nowMin():-1;
  $("nowTitle").textContent=today?"지금 방 상황":dayTitle();
  const openRooms=ROOMS.filter(r=>roomInfo(r).open);
  const busyN=today?openRooms.filter(r=>list.some(b=>b.room===r&&b.start<=nm&&nm<b.end)).length:0;
  const thomasN=ROOMS.filter(r=>roomInfo(r).thomas).length;
  $("nowSub").textContent=(today?`사용 중 ${busyN} · 비어 있음 ${openRooms.length-busyN}`:(list.length?`신청 ${list.length}건`:"신청 없음"))+(openRooms.length<6?` · 사용 불가 ${6-openRooms.length}`:"")+` · 토마스 ${thomasN}개 방`;
  let h="";
  for(const r of ROOMS){
    const ri=roomInfo(r),rl=list.filter(b=>b.room===r).sort((a,b)=>a.start-b.start);
    if(!ri.open){
      h+=`<article class="room closed">
        <div class="rh"><span class="rn">${r}번</span><span class="badge closed">사용 불가</span></div>
        <div class="main closed">사용 불가</div>
        <div class="sub">${esc(ri.memo||"관리자 설정")}</div>
        ${att(r,[])}</article>`;
      continue;
    }
    if(today){
      const cur=rl.find(b=>b.start<=nm&&nm<b.end),up=rl.filter(b=>b.start>nm),nx=up[0];
      if(cur){
        const pct=Math.round((nm-cur.start)/(cur.end-cur.start)*100);
        h+=`<article class="room busy" style="${palette(cur.team)}">
          <div class="rh"><span class="rn">${r}번</span><span class="badge use">사용 중</span></div>
          <div class="main">${esc(cur.team)}조 <span class="hide-m" style="font-weight:500;font-size:.8em">${esc(cur.day)}</span></div>
          <div class="sub"><span class="mono">~${fmt(cur.end)}</span> · ${cur.end-nm}분<span class="hide-m"> 남음</span></div>
          <div class="sub hide-m">${esc(cur.content||"연습")}</div>
          <div class="bar"><span style="width:${pct}%"></span></div>
          <div class="foot-line">${nx?`다음 <b>${fmt(nx.start)}</b> ${esc(nx.team)}조`:"이후 예약 없음"}</div>
          ${att(r,cur.kits)}</article>`;
      }else{
        const soon=nx&&nx.start-nm<=30;
        h+=`<article class="room">
          <div class="rh"><span class="rn">${r}번</span><span class="badge ${soon?"soon":"free"}">${soon?"곧 사용":"비어 있음"}</span></div>
          <div class="main free">${nx?`~${fmt(nx.start)} 빈방`:"오늘 비어 있음"}</div>
          ${nx?`<div class="sub">다음 <span class="mono">${fmt(nx.start)}</span> ${esc(nx.team)}조</div>`:`<div class="sub">&nbsp;</div>`}
          <div class="foot-line">${up.length>1?`이후 ${up.slice(1,3).map(b=>`<b>${fmt(b.start)}</b> ${esc(b.team)}조`).join(" · ")}`:(ri.memo?esc(ri.memo):"&nbsp;")}</div>
          ${att(r,soon?nx.kits:[])}</article>`;
      }
    }else{
      const maxM=2;
      h+=`<article class="room">
        <div class="rh"><span class="rn">${r}번</span><span class="badge ${rl.length?"cnt":"free"}">${rl.length?rl.length+"건":"비어 있음"}</span></div>
        ${rl.length?`<div class="slots">${rl.slice(0,4).map((b,i)=>`<div class="${i>=maxM?"more":""}"><span class="mono">${fmt(b.start)}</span> ${esc(b.team)}조<span class="hide-m">${(b.kits||[]).length?" · "+b.kits.map(kitShort).join(" "):""}</span></div>`).join("")}</div>${rl.length>maxM?`<div class="foot-line m-more">외 ${rl.length-maxM}건</div>`:""}`:`<div class="main free">예약 없음</div>`}
        ${att(r,[])}</article>`;
    }
  }
  $("rooms").innerHTML=h;
}
function renderTimeline(){
  const today=isToday(),nm=nowMin(),list=S.bookings.filter(b=>b.date===S.sel),span=CLOSE-OPEN;
  $("tlTitle").textContent=today?"오늘 시간표":"시간표";
  $("tlSub").textContent=today?(list.length?list.length+"건":""):dayTitle();
  const x=m=>((m-OPEN)/span*100).toFixed(3)+"%";
  let h=`<div class="tl"><div></div><div class="hd">${Array.from({length:15},(_,i)=>`<span class="${i%2?"odd":""}" style="left:${(i/14*100).toFixed(3)}%">${pad(8+i)}</span>`).join("")}</div>`;
  ROOMS.forEach((r,ri)=>{
    h+=`<div class="rl">${r}<span class="hide-m">번</span></div><div class="track ${ri===ROOMS.length-1?"last":""}">`;
    for(const b of list.filter(b=>b.room===r)){
      const past=today&&b.end<=nm;
      h+=`<div class="blk ${past?"past":""}" style="left:calc(${x(b.start)} + 1px);width:calc(${((b.end-b.start)/span*100).toFixed(3)}% - 2px);${palette(b.team)}" title="${esc(teamLabel(b))} ${fmt(b.start)}–${fmt(b.end)} ${esc(b.content)}">
        <b>${esc(b.team)}<span class="dl">조</span></b><span class="t">${fmt(b.start)}–${fmt(b.end)}</span></div>`;
    }
    if(today&&nm>=OPEN&&nm<=CLOSE)h+=`<div class="nowline" style="left:${x(nm)}"></div>`;
    h+=`</div>`;
  });
  $("tl").innerHTML=h+`</div>`;
}
function kitState(id){
  const k=S.kits[id];
  if(k&&k.status==="out")return {cls:"out",t:"대여",w:k.who||""};
  const t=ymd(),nm=nowMin(),l=S.bookings.filter(b=>b.date===t&&(b.kits||[]).includes(id));
  const cur=l.find(b=>b.start<=nm&&nm<b.end);
  if(cur)return {cls:"held",t:"예약",w:`${cur.team}조 · ${cur.room}번 ~${fmt(cur.end)}`};
  const nx=l.filter(b=>b.start>nm).sort((a,b)=>a.start-b.start)[0];
  return {cls:"",t:"보관",w:nx?`${fmt(nx.start)} ${nx.team}조`:""};
}
function renderKits(){
  $("kits").innerHTML=KITS.map(([k,n])=>`<div class="kit"><span class="kn">${n}</span><div class="sets">${SETS.map(s=>{const st=kitState(k+"-"+s);
    return `<div class="ks"><span class="s ${st.cls}" title="${s}세트 ${st.t} ${esc(st.w)}"><i></i>${s} ${st.t}</span><span class="w">${esc(st.w)}</span></div>`}).join("")}</div></div>`).join("");
}
function render(){renderHead();renderNotices();renderDays();renderRooms();renderTimeline();renderKits()}

/* ---------- controls ---------- */
$("days").addEventListener("click",e=>{const b=e.target.closest("[data-date]");if(!b)return;S.sel=b.dataset.date;render();
  const el=document.querySelector(`.day[data-date="${S.sel}"]`);if(el)el.scrollIntoView({block:"nearest",inline:"nearest"})});
function syncTheme(){const dk=document.documentElement.getAttribute("data-theme")==="dark";$("themeBtn").textContent=dk?"☀":"☾";$("themeBtn").setAttribute("aria-label",dk?"밝은 모드로 바꾸기":"다크 모드로 바꾸기")}
$("themeBtn").onclick=()=>{const n=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);store("osce-theme",n);syncTheme()};

/* ---------- boot ---------- */
(async()=>{
  if(!document.documentElement.getAttribute("data-theme"))document.documentElement.setAttribute("data-theme",store("osce-theme")||"light");
  syncTheme();
  if(!LIVE)$("demo").hidden=false;
  render();
  try{await load()}catch(e){setLive("off")}
  render();subscribe();
  let lastDay=ymd();
  setInterval(async()=>{
    if(ymd()!==lastDay){const wasToday=S.sel===lastDay;lastDay=ymd();if(wasToday||S.sel<lastDay)S.sel=lastDay;try{await load()}catch(e){}}
    render();
  },30000);
})();
})();
</script>
</body>
</html>
